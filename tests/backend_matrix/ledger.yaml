    ruling: >-
      Decision panel, 2026-11-24, acting under a standing instruction the
      release owner gave on 2026-11-21; not the owner's own answer, and the
      owner may overrule. Asked, after pack A first ran on this column: what
      to do with this cell, which is red because the result the adapter
      returns when a workflow's tool-dispatch budget denies a call flags its
      token usage, its cost and its terminal incomplete although the
      provider reported usage for every response; and whether the scenario
      owes those flags where a vendor tool owns the tool loop. Decided, 3 of
      3: the scenario owes the three flags on every kind, as it has since it
      was built, and nothing was waived. The cell is accepted as a known gap
      of the reference for this observation and no other: this cell, exactly
      these three codes, no governing declared value, a result built by the
      adapter's handler of a classified exception inside one attempt after
      the adapter cut the session at the denial, with the seam canary, the
      starter tool cells and the turn-limit cells of the column passing in
      the same run and no further request reaching the provider in that run.
      The usage such a result reports is what the adapter had read when it
      cut the session; it is not the same in every play of the same billing,
      this entry states no value and no verdict rests on one. A change of
      the adapter that flags the terminal complete at a stop the adapter
      made itself, and changes nothing else this cell shows, takes the
      terminal code out of this entry under this ruling; the entry never
      grows. The fix belongs to the Claude adapter and is a change of its
      own, made after the change that entered this entry: the result of a
      denial reports the same usage for the same billing, and its accounting
      is flagged complete only where a documented or recorded stop of the
      vendor tool shows it settled. That change deletes this entry in the
      change in which this cell passes, and not while the cell is answered
