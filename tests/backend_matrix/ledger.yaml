        observed_under: {}
        closes_under: {}
      - cell: kimi/S01/blocked/guarded
        observed_under: {}
        closes_under: {}

  M08:
    title: A guarded result of a Kimi route under its cost policy is never rankable
    origin: matrix
    severity: medium
    # Not predicted, and found in review after the first run of the Kimi
    # columns, not by that run: until then "rankable" had no code and was
    # inferred from the absence of a guard rewrite, which holds under the
    # plain diagnostic limit policy only. A route that opts into the cost
    # upper bound binds its limit guard with the cost policy its routing
    # file names. Under that policy the guard lets the result stand
    # (terminal reason diagnostic_cost_upper_bound, one physical attempt,
    # authority kept, the second call answered) and never calls it rankable
    # (crucible/backends/limits.py, _normalize_returned_result), and the
    # routing files say so in their headers ("a cost interval: diagnostic,
    # never rankable or promotable"). In the guarded lens S01, S03 and S04
    # ask that a result without an error is rankable (clause C5), so C5
    # reported guard:not_rankable on the six guarded cells of the two
    # diagnostic columns, and those cells were known gaps of this record.
    # The code did not depend on the missing cache-read count: with the
    # count in the reply the result is just as little rankable.
    # No code of this record is owed any more, and no fix was made. Decided
    # on 2026-11-21 by a decision panel under the release owner's standing
    # instruction (2 of 3; not the owner's own answer, and the owner may
    # overrule): "rankable" does not bind the guarded lens of a route that
    # runs under its cost policy. Not rankable there is what the release
    # means to do, enforced twice in crucible/backends/limits.py and pinned by
    # tests/test_backend_limits_cost_bounds.py, so no change of the product
    # closes it. It is declared difference D-COST-BOUND-UNRANKED of this
    # ledger: C5 holds such a result to the marks of a diagnostic one and
    # asserts each of them. The record stays, as every record does, and its
    # six cells stay pinned, here and in the list of that difference. They
    # are still expected failures, under M06 alone. The record carries no
    # ruling: a ruling here would license withdrawing its cells. What the
    # difference cannot show on a cell: with complete accounting and the
    # opt-in still set, the result stays diagnostic and C5 names nothing.
    # A proof of the Kimi module that the verifier requires by name plays
    # that state.
    cells:
      - cell: kimi/S01/primary/guarded
        observed_under: {}
        closes_under: {}
      - cell: kimi/S03/primary/guarded
        observed_under: {event_detail: tool_calls}
        closes_under: {event_detail: tool_calls}
      - cell: kimi/S04/primary/guarded
        observed_under: {structured_output: prompt_only}
        closes_under: {structured_output: prompt_only}
      - cell: kimi/S01/secondary/guarded
        observed_under: {}
        closes_under: {}
      - cell: kimi/S03/secondary/guarded
        observed_under: {event_detail: tool_calls}
        closes_under: {event_detail: tool_calls}
      - cell: kimi/S04/secondary/guarded
        observed_under: {structured_output: prompt_only}
        closes_under: {structured_output: prompt_only}

