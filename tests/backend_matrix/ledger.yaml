# The ledger of the backend conformance matrix.
#
# known_gaps: a cell listed here is an expected failure only while it fails
#   with exactly these codes. If it passes, the run fails with "gap fixed,
#   delete the entry"; if it fails in another way, with "different deviation".
#   A fix deletes its entry in the same change and, where the ceiling of the
#   entry's pack is frozen, lowers that ceiling by one (see `ceilings`); it
#   edits nothing else here.
#   Only a behaviour cell of a real kind and the static cells H01 and H02 may
#   be listed: a toy cell and the other static cells (P01, P02, P04, H03, H04)
#   check the matrix itself and are never expected failures.
# registry: permanent. A record stays when its gap is fixed, so the passing
#   cell stays pinned. `observed_under` and `closes_under` hold the governing
#   declared values of the cell's scenario; they are equal unless the record
#   names the `declaration_change` (field, from, to, citation) that is the
#   gap's listed resolution. `predicted` holds the codes expected of the
#   cell before the first run of its column; the first run corrects them,
#   except on a record that was closed before a cell saw it red, which keeps
#   them as written.
#   `origin` says where a gap comes from: `gap list` for one that was known
#   before the matrix was built, `matrix` for one the matrix raised or made
#   a record of its own for and `reference` for one found on a reference
#   column.
#   `closes_on_grade` is set on a record whose gap is what a provider sends
#   (a refusal shape, an error body) and, on a reference column, on a record
#   whose gap is what the vendor's tool relays of such a reply or sends when
#   a session is stopped: the weakest grade of scripted reply on which a
#   cell of the record may stop carrying a code of the gap. Static cell H03
#   fails when such a cell carries none while the dialect of its kind still
#   answers it from a weaker reply, so a fix that turns the cell green on a
#   reply constructed from the types of an SDK cannot delete the entry: a
#   reply of the named grade comes first. A cell of a reference may be
#   answered from several frames and its grade is that of the weakest of
#   them, so every frame the cell is answered from has to be of the named
#   grade before the entry can go.
#   `awaits_ruling` is set on a record whose closing state no clause states
#   yet, and names the question that is owed a ruling. Static cell H03 fails
#   when a cell of such a record carries no code of the gap, whatever the
#   cell shows, so a fix cannot delete the entry first: the change that
#   enters the ruling makes the scenario assert what was ruled and takes
#   the field off the record.
#   A `column_wide` entry is one clause code that shows on every cell of a
#   kind where its clause was evaluated and its check was asked (C6 asks for
#   pricing evidence only of a result that flags its cost complete, and a
#   flag that the scenario of a cell waives or expects false is not asked
#   of its result; where the cost flag is expected false, outright or
#   because the provider billed nothing for the call, no evidence is asked
#   either). It is owed there and tolerated nowhere else.
# declared_differences: differences no feature field expresses. Each has a
#   product citation, an owner, a date and the alternative contract asserted
#   instead; a cell passes only if the alternative holds. Either a variant of
#   a scenario's difference table asserts it (a declared value selects it), or
#   the scenario defines it and `cells` lists where it is in force. One
#   restates a line of a clause: where a routing file opts into a cost upper
#   bound, clause C5 holds a guarded result to the marks of a diagnostic
#   result instead of to "rankable", and asserts each mark itself; `cells`
#   then lists exactly the cells of such routes (static cell H03). No other
#   declared difference touches a clause, and none may touch clause C6, the
#   accounting. They are counted apart from the known gaps.
# ruling: a decision of the release owner, or of a decision panel that acts
#   under a standing instruction of the owner; its text says which, and the
#   owner may overrule a panel. Where it is written decides what it does.
#   On a known gap, cell by cell or column-wide, it records that the
#   expected failure is accepted; an entry on a reference column must carry
#   one, and it licenses nothing. On a registry record it is the licence to
#   withdraw a cell of that record: H03 then accepts that the cell is
#   pinned not expressible or is no longer generated, and H03 refuses a
#   ruling on a record none of whose cells is withdrawn. So a ruling that
#   keeps a gap is written in the entries of the gap, never in its record.
# scenario sets: the scenarios (scenarios.py) come in three sets. The starter
#   set is S00 (the seam canary), S01, S03 and S04. Pack A is S10a, S11, S12,
#   S13, S18, S23a to S23c and S40: the limits (turns, tool dispatch, USD,
#   tool-result bytes), the refusals and a write as progress. Pack B is
#   every scenario that is in neither, and is still landing. The toy kind
#   and every real kind run all three sets (`ENABLEMENT` in cells.py). On a
#   real kind the starter set and pack A run on the primary and on the
#   secondary column, and pack B on the primary column only, each scenario
#   from the change that defines it. A blocked column runs S00, S01 and the
#   admission scenario S51 whatever sets its kind runs. The static cell H02
#   of a driven kind reports static:pack_a_not_enabled for a kind that does
#   not run pack A. Pack B has no such code: a registry record lists a cell
#   of pack B only once the kind of the cell runs the set, which every real
#   kind does.
# ceilings: counts may not exceed them. `pack_a` counts the entries on
#   static cells and on scenarios of the starter set and of pack A, and
#   every column-wide entry; `pack_b` counts those on scenarios of pack B.
#   A ceiling rises while the entries of its pack land and is frozen once
#   every scenario of the pack is defined, the pack runs on every real kind
#   and every cell of it passes or has its entry; after that it only falls.
#   Pack A runs on every real kind and every cell of it passes or has its
#   entry: its ceiling is frozen at the count below, stated by the change
#   that entered the last ruling on a reference cell of the pack, and from
#   here on it only falls. Pack B runs on every real kind and its scenarios
#   are still landing: its ceiling still rises.
#   `frozen` names the packs whose ceiling is frozen. A frozen ceiling is
#   the count of its pack, and static cell H03 fails on any other number
#   (static:ceiling_not_the_count). So the change that takes an entry of a
#   frozen pack away lowers the ceiling of that pack by one in the same
#   change, and a later entry finds no room that a fix left: it has to
#   raise a number that only falls.
#
# Cell ids read <kind>/<scenario>/<role>/<lens>.

schema_version: crucible.backend-matrix.ledger.v1

ceilings:
  max_known_gaps:
    pack_a: 74
    pack_b: 24
  frozen: [pack_a]
  max_declared_differences: 4

registry:
  G02:
    title: Kimi labels a tool-budget stop a transport error and records no limit event
    origin: gap list
    severity: high
    cells:
      - cell: kimi/S12/primary/raw
        observed_under: {}
        closes_under: {}
        predicted:
          - "kind:transport!=max_turns"
          - "event.missing:limit/tool_dispatch_budget"
      # Observed at the first run of the secondary column. What else the
      # two cells show is the shape of a result built from an outcome of the
      # worker's exception classifier, which is another record (M11).
      - cell: kimi/S12/secondary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["kind:transport!=max_turns", "event.missing:limit/tool_dispatch_budget"]

  G03:
    title: Kimi does not credit a write as progress (frozen wrapper handed to the mutation host)
    origin: gap list
    severity: high
    # Closed: where the attached ToolSet is the progress wrapper, the adapter
    # hands the mutation host that wrapper, so a write that ran in the host
    # resets the streak of reads, and the bridge serves the frozen catalogue
    # as before. The call of the two cells ends cleanly, the three codes of
    # M11 went with the five of this record, and the cells have no entry any
    # more: they owe the two column-wide codes of M06 alone. Reads alone
    # still end at the bound (tests/test_backends_kimi.py).
    cells:
      - cell: kimi/S40/primary/raw
        observed_under: {}
        closes_under: {}
        # While G02 is open the denied read ends as a transport error; the
        # kind code becomes kind:max_turns!=none once G02 is fixed.
        predicted:
          - "progress:write_not_credited"
          - "kind:transport!=none"
          - "stop:tool_budget_exhausted!=end_turn"
          - "dispatch.missing:read_a"
          - "request.unconsumed"
      # Observed at the first run of the secondary column.
      - cell: kimi/S40/secondary/raw
        observed_under: {}
        closes_under: {}
        predicted:
          - "progress:write_not_credited"
          - "kind:transport!=none"
          - "stop:tool_budget_exhausted!=end_turn"
          - "dispatch.missing:read_a"
          - "request.unconsumed"

  G04:
    title: Kimi worker tests skip without the worker runtime, and the column is not driven
    origin: gap list
    severity: high
    cells:
      # Closed with the Kimi columns: the tests that need the worker runtime
      # take a fixture that fails without it, CI installs the runtime in
      # every test shard, and the cell has no entry any more. A skip marker
      # on a worker interpreter is static:worker_skip_unpinned from now on.
      - cell: kimi/H01/-/static
        observed_under: {}
        closes_under: {}
        predicted: ["static:worker_skip"]
      # static:no_driven_column until the driver landed, then
      # static:pack_a_not_enabled until pack A ran on the columns. Closed
      # with pack A on the two diagnostic columns: the cell has no entry any
      # more.
      - cell: kimi/H02/-/static
        observed_under: {}
        closes_under: {}
        predicted: ["static:pack_a_not_enabled"]

  G14:
    title: DeepSeek appends a limit event after the terminal event, so invoke raises
    origin: gap list
    severity: high
    # The gap is the limit exits (turn limit, USD budget, tool-result byte
    # budget), and its cells are of pack A. Their predictions were made for
    # the initial release, where a limit event after the terminal made
    # invoke raise and the paid usage was lost. Closed for pack A before any
    # cell saw it: the update that moved the open-weight routes to their
    # current models had given each limit exit a terminal of its own, so no
    # cell of the matrix has seen that raise and no cell carries a code of
    # this record. At the first run of pack A the turn limit and the USD
    # overrun returned typed results with their limit event and a terminal
    # named after the stop reason (the first cell is an expected failure for
    # the tool-authority digest of G24 alone, the second for the column-wide
    # code of G24 alone), and the byte budget ended the call with a typed
    # stop of its own, which is another record, M14. The predictions are
    # kept as they were written: they are the codes the cells show if the
    # raise comes back, and a cell that shows them fails as a different or
    # an unexpected deviation. Only a cell that shows the raise reopens this
    # record. That the record is closed for pack A, and that only the raise
    # reopens it, was ruled on 2026-11-24 by a decision panel that acts
    # under a standing instruction of the release owner, who may overrule
    # it. What the column shows about the terminal of an exit without a
    # limit is another record, M05.
    cells:
      - cell: deepseek/S10a/primary/raw
        observed_under: {turn_limit: hard}
        closes_under: {turn_limit: hard}
        predicted: ["raise:ValueError@after_request/assay.types.invocation"]
      - cell: deepseek/S13/primary/raw
        observed_under: {usd_limit: post_hoc}
        closes_under: {usd_limit: post_hoc}
        predicted: ["raise:ValueError@after_request/assay.types.invocation"]
      - cell: deepseek/S18/primary/raw
        observed_under: {}
        closes_under: {}
        # As first written. The first run showed no raise and no code of
        # this record on the cell; what the cell shows is M14's.
        predicted:
          - "raise:ValueError@after_request/assay.types.invocation"
          - "request.unconsumed"

  G15:
    title: DeepSeek raises before transport for max_turns above 64
    origin: gap list
    severity: high
    awaits_ruling: >-
      what a turn ceiling of an adapter's own owes as its report on a route
      whose wire carries no turn control
    # The cell asks for the suite's turn count and one completion. It holds
    # that the call returns a result from one request, that a turn control
    # on the wire is the count that was asked for and, on a route that
    # declares an enforced turn limit, that every request carries the count
    # where the wire has a field for one. The wire of this route has none,
    # so the cell cannot tell an adapter that takes the count from one that
    # cuts it to a ceiling of its own and says so nowhere. The closing state
    # of the gap is a ceiling that is applied and reported, or a refusal at
    # routing with no request; what "reported" asks on this wire is stated
    # by no clause yet. Until that is ruled the record waits
    # (`awaits_ruling`): a fix that clamps makes the cell stop raising and
    # leaves on it the terminal name that is M05's subject, which does not
    # show that the gap is closed. Such a fix adds the cell to M05's record.
    cells:
      - cell: deepseek/S11/primary/raw
        observed_under: {turn_limit: hard}
        closes_under: {turn_limit: hard}
        predicted:
          - "raise:ValueError@before_request/crucible.backends.deepseek"
          - "request.unconsumed"

  G16:
    title: DeepSeek records one request event per provider round, which the limit guard rejects
    origin: gap list
    severity: high
    cells:
      - cell: deepseek/S03/primary/guarded
        observed_under: {event_detail: tool_calls}
        closes_under: {event_detail: tool_calls}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      - cell: deepseek/S04/primary/guarded
        observed_under: {structured_output: prompt_only}
        closes_under: {structured_output: prompt_only}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      # Observed at the first run of pack A: the two tool rounds before
      # the turn limit are two request events.
      - cell: deepseek/S10a/primary/guarded
        observed_under: {turn_limit: hard}
        closes_under: {turn_limit: hard}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]

  G17:
    title: DeepSeek does not credit a write as progress (frozen wrapper handed to the mutation host)
    origin: gap list
    severity: high
    # Closed: where the attached ToolSet is the progress wrapper, the adapter
    # hands the mutation host that wrapper, so a write that ran in the host
    # resets the streak of reads. The call of the cell ends cleanly and no
    # code of this record is left on it. Its entry stays for what every
    # clean tool cell of the column shows: the tool-authority digest of G24
    # and, now that the call reaches a clean finish, the terminal name of
    # M05. Reads alone still end at the bound
    # (tests/test_backends_deepseek.py).
    cells:
      - cell: deepseek/S40/primary/raw
        observed_under: {}
        closes_under: {}
        predicted:
          - "progress:write_not_credited"
          - "kind:max_turns!=none"
          - "stop:tool_budget_exhausted!=end_turn"
          - "dispatch.missing:read_a"
          - "request.unconsumed"

  G18:
    title: DeepSeek has no content-rejected path
    origin: gap list
    severity: high
    closes_on_grade: documented
    # Each of the three forms of refusal ends as a non-retriable transport
    # error, as predicted: that kind is the whole of this gap. A response
    # that a content filter stopped (the terminal of an incomplete response)
    # is typed from its terminal; the name of that terminal event is M05's
    # subject. A response whose message holds a refusal part and a request
    # the service rejects with an HTTP status both end as an error of the
    # worker; what the result of such an error loses beside its kind is
    # another record, M13. The three replies are constructed from the types
    # of the pinned SDK: no refusal of the route was observed or is
    # documented, so the gap cannot be closed on these envelopes
    # (`closes_on_grade`).
    cells:
      - cell: deepseek/S23a/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["kind:transport!=content_rejected"]
      - cell: deepseek/S23b/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["kind:transport!=content_rejected"]
      - cell: deepseek/S23c/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["kind:transport!=content_rejected"]

  G20:
    title: No DeepSeek test runs a protocol exchange; the column is not driven
    origin: gap list
    severity: high
    cells:
      # static:no_driven_column until the driver landed, then
      # static:pack_a_not_enabled until pack A ran on the column. Closed with
      # pack A on the column: the cell has no entry any more.
      - cell: deepseek/H02/-/static
        observed_under: {}
        closes_under: {}
        predicted: ["static:pack_a_not_enabled"]

  G24:
    title: The DeepSeek trace binds no feature profile, and its tool-authority digest is not the shared one
    origin: gap list
    severity: medium
    # Every result of the adapter carries a trace without the digest of the
    # route's feature profile. With a ToolSet attached the trace binds a
    # tool-authority digest built from bridge constants of the adapter's own,
    # so it never equals the digest the workflows and the other backends
    # compute for the same ToolSet.
    column_wide:
      - {kind: deepseek, code: "digest.missing:feature_profile"}
    cells:
      - cell: deepseek/S03/primary/raw
        observed_under: {event_detail: tool_calls}
        closes_under: {event_detail: tool_calls}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S03/primary/guarded
        observed_under: {event_detail: tool_calls}
        closes_under: {event_detail: tool_calls}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S04/primary/raw
        observed_under: {structured_output: prompt_only}
        closes_under: {structured_output: prompt_only}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S04/primary/guarded
        observed_under: {structured_output: prompt_only}
        closes_under: {structured_output: prompt_only}
        predicted: ["digest.mismatch:tool_authority"]
      # Observed at the first run of pack A: every cell that attaches a
      # ToolSet and returns a result.
      - cell: deepseek/S10a/primary/raw
        observed_under: {turn_limit: hard}
        closes_under: {turn_limit: hard}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S10a/primary/guarded
        observed_under: {turn_limit: hard}
        closes_under: {turn_limit: hard}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S12/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S18/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S40/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["digest.mismatch:tool_authority"]
      # The scenarios of a write that succeeds: three more tool cells.
      - cell: deepseek/S41/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S44/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["digest.mismatch:tool_authority"]
      - cell: deepseek/S45/primary/raw
        observed_under: {}
        closes_under: {}
        predicted: ["digest.mismatch:tool_authority"]

  G28:
    title: The gateway adapter records one request event per completion, which the limit guard rejects
    origin: gap list
    severity: high
    cells:
      - cell: openai_compat:hosted/S03/primary/guarded
        observed_under: {event_detail: usage}
        closes_under: {event_detail: usage}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      - cell: openai_compat:hosted/S04/primary/guarded
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      - cell: openai_compat:local/S03/primary/guarded
        observed_under: {event_detail: usage}
        closes_under: {event_detail: usage}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      - cell: openai_compat:local/S04/primary/guarded
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      # Observed at the first run of the secondary column.
      - cell: openai_compat:hosted/S03/secondary/guarded
        observed_under: {event_detail: usage}
        closes_under: {event_detail: usage}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      - cell: openai_compat:hosted/S04/secondary/guarded
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      # Observed at the first run of pack A: the two tool rounds and the
      # forced finalisation at the turn limit are three request events.
      - cell: openai_compat:hosted/S10a/primary/guarded
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      - cell: openai_compat:hosted/S10a/secondary/guarded
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]
      - cell: openai_compat:local/S10a/primary/guarded
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["guard:limit_contract_violated", "guard:revoked"]

  G29:
    title: The gateway adapter clears the accounting flags after a forced finalisation
    origin: gap list
    severity: high
    # Closed. The adapter carries what the reply to the finalisation itself
    # reported of its usage, and whether an attempt of the finalisation was
    # discarded, into the flags of the result: they are true only where every
    # response of the call, the finalisation included, reported its usage.
    # No cell carries a code of this record any more. The six raw cells have
    # no entry; the six guarded cells keep theirs for the guard codes of G28
    # alone.
    cells:
      - cell: openai_compat:hosted/S04/primary/raw
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:hosted/S04/primary/guarded
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:hosted/S10a/primary/raw
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:local/S04/primary/raw
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:local/S04/primary/guarded
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:local/S10a/primary/raw
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      # Observed at the first run of the secondary column.
      - cell: openai_compat:hosted/S04/secondary/raw
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:hosted/S04/secondary/guarded
        observed_under: {structured_output: unsupported}
        closes_under: {structured_output: unsupported}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      # Observed at the first run of pack A: the forced finalisation at the
      # turn limit clears the flags in both lenses, on every column.
      - cell: openai_compat:hosted/S10a/secondary/raw
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:hosted/S10a/primary/guarded
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:hosted/S10a/secondary/guarded
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]
      - cell: openai_compat:local/S10a/primary/guarded
        observed_under: {turn_limit: round_boundary}
        closes_under: {turn_limit: round_boundary}
        predicted: ["flag:token_usage_complete=False", "flag:cost_complete=False"]

  G30:
    title: Every gateway test stubs the client and the local route has no test; the columns are not driven
    origin: gap list
    severity: high
    cells:
      # static:no_driven_column until the drivers landed, then
      # static:pack_a_not_enabled until pack A ran on the columns. Closed
