  M06:
    title: The Kimi routes flag token and cost accounting incomplete for every reply that carries no cache-read count
    origin: matrix
    severity: medium
    # Not predicted when the matrix was designed: the predictions were
    # written for the initial release, whose Kimi routes accounted exactly
    # for a plain reply. Seen at the first run of the columns, on the model
    # every Kimi profile routes since the update that moved the open-weight
    # routes to their current models. The provider's final statistics carry
    # no count of cache reads unless the request hit its cache (observed
    # live on 2026-11-18; the envelopes of the columns are that reply), and
    # the adapter never reads a missing count as zero. So no result of these
    # routes flags its token usage or its cost complete: on the two
    # diagnostic routes, which opt into the cost upper bound, a result is a
    # cost interval (the lower bound as cost, the upper bound charged to the
    # budget); on the strict route the reply is rejected (M07). On the cells
    # of the blocked column the two flags are false because that result is
    # an error without usage, not because of an interval: a ruling or a fix
    # of this record alone leaves the two codes there, and M07's entries
    # take them over.
    # What the two codes do not hide on the diagnostic routes: where a route
    # opts into the cost bound, clause C6 holds the interval itself (it is
    # there, it covers the reported usage, the reported cost is its lower
    # bound, the tokens are the billed ones, one segment per billed
    # response), so accounting that is lost or partial is a deviation of its
    # own. What they do hide: such a route prices a segment from the
    # constants of its cost policy (crucible/backends/kimi.py,
    # _cost_bound_amounts; crucible/backends/cost_bounds.py), never from the
    # pricing file, so the matrix rate card does not govern its cost. The
    # lower bound of today's reply lies below the rate-card price (it does
    # while the output tokens are at most 0.9 of the input). With a
    # cache-read count in the reply the flags are complete, the interval is
    # exact and the cost is above the rate-card price: the cells then owe
    # usage.cost_usd:gt.
    # What a segment costs is held as well, wherever C6 asks for the
    # interval (a result of a scenario that owes the cost flag, a limit exit
    # included, in both lenses): the lower and the upper bound of every
    # segment are what the shipped price row of the route's model
    # (crucible/backends/pricing.py, DEFAULT_PRICING; the rate table of the
    # cost policy by the product's own replay) gives for the usage the
    # segment records, or the cell names usage.cost_bounds:amounts. A
    # result whose segments are priced at nothing, or whose upper bounds
    # (what a budget is charged) are lowered to the lower ones while its
    # segments call their count of cache reads unknown, is a deviation of
    # its own in the raw lens; in the guarded lens of a clean finish the
    # limit guard replays the formula and rewrites such a result first.
    # That rule prices the usage a segment records, so by itself it holds
    # nothing of a segment that states a count: with a count of cache reads
    # stated beside them the same lowered amounts are right for the record.
    # Such a result lowers what a budget is charged, down to the lower
    # bound when every input token is said to be read; the limit guard's
    # replay accepts it and keeps its cost authority; and at today's rates
    # the rate card names its reported cost (usage.cost_usd:gt) only while
    # the stated counts add up to less than ten ninths of the output
    # tokens, a missing count read as zero being the loudest of them. From
    # there up it showed in neither lens. So the counts are held too: the
    # provider side of a cell records for every billed response which count
    # of cache reads and of cache writes the reply carried, read back from
    # the bytes it sent (a count that is not there is missing, never zero),
    # and C6 holds every segment to it, in both lenses and on a limit exit,
    # or the cell names usage.cost_bounds:counts. Where the dialect of a
    # route reads no counts back, C6 refuses to judge an interval. What the
    # two rules do not hold is a change that the adapter's constants and
    # the shipped row make together: one proof of the Kimi module pins the
    # amounts of one cell as numbers and the verifier requires it by name;
    # the product's own tests pin more.
    # Ruled on 2026-11-21 by a decision panel under the release owner's
    # standing instruction, 2 of 3 (the owner may overrule). (a) The two
    # accounting flags bind every route, so the gap stays. (b) The matrix
    # rate card is the reference of the reported cost on every column; the
    # shipped price row of the route's model is the reference of the two
    # bounds of a segment, and of nothing else. That ruling is the `ruling`
    # of the two column-wide entries of this record. The record itself
    # carries none: a ruling on a record is the licence to withdraw its
    # cells. (c), whether "rankable" binds such a route, was M08's question
    # and is decided there. Not closable by code alone: reading a missing
    # count of cache reads needs a recorded provider fact. A fix of this
    # record is accepted only when the opt-in of the route into the cost
    # upper bound is decided with it (removed, or kept by a recorded
    # ruling): while a route opts in, its results stay diagnostic whatever
    # their accounting says, and the Kimi diagnostic routes return no
    # rankable result. That is a limit of the route, for which no fix is
    # proposed (declared difference D-COST-BOUND-UNRANKED).
    column_wide:
      - {kind: kimi, code: "flag:token_usage_complete=False"}
      - {kind: kimi, code: "flag:cost_complete=False"}

  M07:
    title: The strict Kimi route rejects a billed reply that carries no cache-read count and returns a transport error
    origin: matrix
    severity: medium
    # Not predicted, and seen at the first run of the blocked column: the
    # route enforces feature admission, so it cannot carry the cost upper
    # bound, and its worker rejects the provider's ordinary reply after it
    # was billed (the missing count of M06). The call ends as a
    # non-retriable transport error with stop reason error: no served model,
    # no usage, a terminal the result disowns. Under the diagnostic limit
    # guard the incomplete evidence also revokes the next call. A live
    # check of the shipped profiles saw the same on the production route
    # (2026-11-19) and left it to the owner: accept it, refuse a routing file
    # whose catalog entry is blocked, or redefine the comparison arm that
    # uses this route (arm C of the E12 provider-lane comparison,
    # products/<product>/e12_arms.yaml). Ruled on 2026-11-21 by a decision
    # panel under the owner's standing instruction: accepted as a known gap;
    # a refusal at binding is planned with the gap fixes and does not turn
    # these cells green. That ruling is the `ruling` of the two known-gap
    # entries of this record. The record itself carries none, because a
    # ruling here would license withdrawing its cells.
    # The codes of the two cells are those of any rejection after the
    # request; the cause is in the text of the error, which is no code. Two
    # proofs of the Kimi module, which the verifier requires by name, hold
    # it: the error names the missing counter (code=counter_missing, field
    # R), where a reply that carries the count and lacks its closing message
    # leaves the same codes under another text; and the same two cells,
    # answered with a reply that carries the count, yield no code at all.
    # The result of the two cells is built from an outcome of the worker's
    # exception classifier, the outcome M11 records on the diagnostic
    # routes. Here the reply is rejected while its frames are read, before
    # any step has settled: the outcome carries no usage, no segment and no
    # model, and no terminal was seen. A decision panel under the owner's
    # standing instruction ruled on 2026-11-24 that the terminal code and
    # the served-model code of the two cells stay in the two ruled entries
    # of this record (the owner may overrule). A fix of M11 that changes
    # what these cells show edits the two entries in the same change and
    # says so. Such an edit only takes codes out of the two entries: a code
    # that neither cell shows at the date of this ruling goes to a decision
    # of its own before a ruled entry takes it.
