  - id: D-COST-BOUND-UNRANKED
    citation: >-
      crucible/backends/limits.py (_normalize_returned_result: a result under
      a bound cost policy, or one that carries a cost interval, is never
      called rankable; InvocationLimitTerminal refuses a rankable terminal
      with a cost policy or cost bounds); the headers of the routing files
      that opt into the cost upper bound ("A result is a cost interval:
      diagnostic, never rankable or promotable"); pinned by
      tests/test_backend_limits_cost_bounds.py
    owner: >-
      decision panel acting under a standing instruction the release owner
      gave on 2026-11-21, 2 of 3; not an answer of the owner in person, and
      the owner may overrule. Asked whether "rankable" binds the guarded
      lens of a route that runs under its cost policy, it decided that it
      does not (registry record M08 of this ledger)
    date: "2026-11-21"
    alternative: >-
      On a route whose routing file opts into the cost upper bound, a guarded
      result that ends without an error is held to the marks of a diagnostic
      result instead of to "rankable": the limit guard let it stand, the
      terminal it left has the reason diagnostic_cost_upper_bound under the
      cost policy the routing file names, records exactly one physical
      attempt and keeps its cost authority, the guard does not call the
      result rankable, and a second plain call is answered from one request.
      Clause C5 asserts each of these itself wherever the routing file opts
      in (the one selector, read from the file and never from the adapter,
      the guard or the terminal), and names the mark that is missing; on
      every other route it asserts "rankable" as before. An error result and
      a result the guard replaced are judged as on every route. The
      difference waives nothing of clause C6: the accounting flags and the
      cost interval are owed in full, so the listed cells stay expected
      failures while known gap M06 is open. The list is exactly the guarded
      result cells of such routes; static cell H03 holds it to them.
