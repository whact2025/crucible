  R04:
    title: The official Codex route flags its token usage incomplete on a reply that is not all cache-read, and its cost complete without pricing evidence
    origin: reference
    severity: medium
    # First run of the column, not predicted. Accepted by the release owner
    # as a known gap of the official-SDK route; a strict expected failure
    # until the product is fixed. Ruled by the release owner in person on
    # 2026-11-21: asked whether to accept the two findings on the official
    # Codex route as known gaps and keep the real worker, the owner accepted
    # both. That ruling is the `ruling` of the entries of the starter set
    # that name this record and of its two column-wide entries. The entry of
    # pack A that names it carries the ruling of a decision panel instead:
    # the owner ruled on the finding, and that the cell of pack A shows it
    # and nothing else is the panel's finding. Here it is restated and is
    # not a field of the record: a ruling on a registry record is leave to
    # withdraw the record's cells (H03 then accepts a cell that is pinned
    # not expressible or no longer generated), which was not ruled. The
    # severity is the one proposed with the finding; the ruling names none.
    # One accounting rule of both Codex transports for usage without a
    # cache-write counter, not a quirk of this route: on the same
    # notifications, without the exact usage notification, the app-server
    # adapter shows the same two codes (and the kind code of its enforcing
    # admission), and the official client never asks for that notification.
    # crucible/backends/codex_official.py: the token partition is complete
    # only when all input was read from a cache;
    # crucible/backends/codex.py, _codex_usage_cost_upper_bound: the cost is
    # flagged complete whenever the cache-write rate is absent or equals the
    # input rate, with pricing evidence built only when both flags are true.
    # pricing:unreconciled therefore shows only under a rate without a
    # cache-write premium (the matrix rate card); under the shipped price of
    # the route's model the adapter clears the cost flag too. In the guarded
    # lens the limit guard replaces the result and revokes the backend.
    # What the column-wide flag code waives: clause C6 takes any lower bound
    # for honest once the token flag is false, so while these entries stand
    # the token comparison of C6 is off on every cell of the kind (a result
    # that reported no tokens at all would show the same codes). What still
    # compares the reported tokens with the provider's ledger on this column
    # are two tests of the official module, both required by name by the
    # verifier (cells.REQUIRED_PROOFS): a turn of one response, and the test
    # that plays both readings of `last` on a turn of several, with its twin
    # for the guarded lens; and, for the result of a dispatch-budget denial,
    # a third, under the record of that cell (R09).
    column_wide:
      - {kind: "codex:official", code: "flag:token_usage_complete=False"}
      - {kind: "codex:official", code: "pricing:unreconciled"}
    cells:
      - cell: codex:official/S01/primary/guarded
        observed_under: {}
        closes_under: {}
      - cell: codex:official/S03/primary/guarded
        observed_under: {event_detail: usage}
        closes_under: {event_detail: usage}
      - cell: codex:official/S04/primary/guarded
        observed_under: {structured_output: native}
        closes_under: {structured_output: native}
      # Observed at the first run of pack A: the guard replaces the result
      # of the turn limit too.
      - cell: codex:official/S10a/primary/guarded
        observed_under: {turn_limit: unsupported}
        closes_under: {turn_limit: unsupported}

  R05:
    title: On the official Codex route a turn of several model responses reports the usage of its last response (unconfirmed, reference emulated)
    origin: reference
    severity: medium
    # Unconfirmed. First run of the column, not predicted; the codes below
    # are as observed. Accepted by the release owner as a second known gap
    # of the route; a strict expected failure until it is settled and, if it
    # is a defect, fixed. Ruled by the release owner in person on
    # 2026-11-21: asked whether to accept the two findings on the official
    # Codex route as known gaps and keep the real worker, the owner accepted
    # both. That ruling is the `ruling` of the entries of the starter set
    # that name this record. The entries of pack A and of the writer
    # scenarios of pack B that name it carry the ruling of a decision panel
    # instead: the owner ruled on the finding, and that those cells show it
    # and nothing else is the panel's finding. Here it is restated and is
    # not a field of the record: a ruling on a registry record is leave to
    # withdraw the record's cells (H03 then accepts a cell that is pinned
    # not expressible or no longer generated), which was not ruled.
    # It rests on the reading of the last-response usage field. The worker
    # reports `last` of the turn's usage
    # (crucible/backends/codex_worker/src/crucible_codex_worker/__main__.py).
    # The envelope of the usage notification fills `last` with one model
    # response, a choice no source in reach states: the vendor's type names
    # the field and no meaning. Filled with the turn so far, the same cells
    # report the whole turn and show R04's codes only
    # (test_what_a_turn_of_several_responses_reports_rests_on_the_reading_of_last
    # in the official module, required by name by the verifier). The green
    # app-server column is no evidence either way: its adapter never reads
    # `last` there. So it is a wrong envelope or an under-count of the
    # worker, and nothing in the matrix can say which.
    # What settles it: a recording of the real tool at the pinned version
    # (what `last` holds on a turn of several model responses). If the tool
    # sends one response there, the worker under-counts every such turn and
    # a budget on this route is compared with the cost of the last response
    # only; if it sends the turn so far, there is no gap, the envelope
    # changes and this record's codes go.
    # The severity was set when the record was written, not by the owner
    # (the ruling names none): medium while the record is unconfirmed, to be
    # raised if a recording confirms an under-count.
    # Never closed or dropped because usage.cost_usd:lt went away. That code
    # shows only while the adapter flags the cost complete (R04's second
    # behaviour, under a rate without a cache-write premium): a change of
    # that flag alone removes the code and leaves the worker as it is. The
    # record closes on a worker, or on an envelope after a recording, under
    # which the test named above no longer holds.
    cells:
      - cell: codex:official/S03/primary/raw
        observed_under: {event_detail: usage}
        closes_under: {event_detail: usage}
        predicted: ["usage.cost_usd:lt"]
      - cell: codex:official/S03/primary/guarded
        observed_under: {event_detail: usage}
        closes_under: {event_detail: usage}
        predicted: ["usage.cost_usd:lt"]
      - cell: codex:official/S04/primary/raw
        observed_under: {structured_output: native}
        closes_under: {structured_output: native}
        predicted: ["usage.cost_usd:lt"]
      - cell: codex:official/S04/primary/guarded
        observed_under: {structured_output: native}
        closes_under: {structured_output: native}
        predicted: ["usage.cost_usd:lt"]
      # Observed at the first run of pack A, on its turns of several model
      # responses: the turn limit of a route without a turn control (three
      # tool rounds and the answer), the tool-result byte budget and the
      # write as progress. The test named above plays both readings of
      # `last` on the raw cell of each, and its twin
      # (test_what_a_guarded_turn_of_several_responses_shows_rests_on_the_reading_of_last,
      # required by name too) on every guarded cell whose entry names this
      # record: there the usage code goes with the reading, the two guard
      # codes of R04 stay, and the guard names the token flag as the only
      # evidence it misses.
      - cell: codex:official/S10a/primary/raw
        observed_under: {turn_limit: unsupported}
        closes_under: {turn_limit: unsupported}
      - cell: codex:official/S10a/primary/guarded
        observed_under: {turn_limit: unsupported}
        closes_under: {turn_limit: unsupported}
      - cell: codex:official/S18/primary/raw
        observed_under: {}
        closes_under: {}
      - cell: codex:official/S40/primary/raw
        observed_under: {}
        closes_under: {}
      # Observed at the first run of the writer scenarios of pack B; the
      # test named above plays both readings of `last` on the raw cell of
      # each.
      - cell: codex:official/S41/primary/raw
        observed_under: {}
        closes_under: {}
      - cell: codex:official/S44/primary/raw
        observed_under: {}
        closes_under: {}
      - cell: codex:official/S45/primary/raw
        observed_under: {}
        closes_under: {}

  R07:
    title: The Claude adapter flags token usage, cost and terminal incomplete on the result of a dispatch-budget denial, and the usage it reports there is not the same in every play
    origin: reference
    severity: medium
    closes_on_grade: documented
    # First run of pack A on the two columns, not predicted. A known gap of
    # the reference by the ruling of a decision panel, not an answer of the
    # release owner in person. That ruling is the `ruling` of every
    # known-gap entry that names this record. It is not a field of the
    # record: a ruling on a registry record is leave to withdraw the
    # record's cells (H03 then accepts a cell that is pinned not expressible
    # or no longer generated), which was not ruled.
    # The scenario owes the two accounting flags and the terminal flag on
    # every kind, and nothing was waived. When a workflow's tool-dispatch
    # budget denies a call, the adapter cuts the session and builds its
    # result in the handler of a classified exception inside the per-attempt
    # function (crucible/backends/claude.py, _invoke_once), with the three
    # flags false; the function that merges attempts (_finalize_attempts)
    # keeps it. The kind, the stop reason, the limit event, the one dispatch
    # and the tool-authority digest are as the scenario asks.
    # What no code of the cells shows. The usage the result reports is what
    # the stream had consumed when the session was cut: a billed response
    # whose frame the adapter had received can be missing from it and from
    # the usage events of the trace, and it differs between plays of the
    # same billing. While the entries stand, clause C6 compares no reported
    # usage with the provider's ledger on these two cells, where the Kimi
    # cells of the same scenario are held to the exact numbers. The trace of
    # a denial carries a second limit event, for the turn limit, and the
    # text of the error names the turn limit; no clause reads either. The
    # in-process tool bridge answers a denied call to the vendor tool as an
    # ordinary error when its wait loop looks again; the adapter's cut comes
    # before that answer, and with the cut delayed past it a further request
    # reaches the provider (a forced run, not the product as shipped).
    # The frames of the cells are constructed and nothing was observed of
    # the real tool: whether a stopped tool can settle the accounting of the
    # turn it was cut in is not known. A product test pins the three flags
    # as they are (tests/test_backends_claude.py,
    # test_agent_tool_dispatch_budget_denial_cancels_sdk_tool_loop).
    # The severity is the panel's: the result fails closed and nothing is
    # overspent. A development budget books such a call as accounting debt
    # and withdraws its own authority, a caller behind the limit guard is
    # refused its next call on the backend, the planning session marks the
    # operation indeterminate, and the usage reported can understate the
    # bill.
    # The grade this record closes on is read today from the frame that
    # opens a session and the frame of a tool call (`cli.init`,
    # `cli.assistant_tool_use`); neither is what the tool sends when a
    # session is stopped. The fix brings the frames of a stopped session
    # into the steps the scenario's script renders, at grade `documented` or
    # better, before an entry goes; a regrade of today's frames alone
    # releases nothing.
    cells:
      - cell: claude/S12/primary/raw
        observed_under: {}
        closes_under: {}
      - cell: claude/S12/secondary/raw
        observed_under: {}
        closes_under: {}

  R08:
    title: The app-server Codex route flags token usage and cost incomplete on the result of a dispatch-budget denial although it reports every billed response
    origin: reference
    severity: medium
    closes_on_grade: documented
    # First run of pack A on the column, not predicted. A known gap of the
    # reference by the ruling of a decision panel, not an answer of the
    # release owner in person. That ruling is the `ruling` of every
    # known-gap entry that names this record. It is not a field of the
    # record: a ruling on a registry record is leave to withdraw the
    # record's cells (H03 then accepts a cell that is pinned not expressible
    # or no longer generated), which was not ruled. One record for each
    # Codex route: the two routes return different results from two branches
    # of one site (R09).
    # The scenario owes the accounting flags on every kind. When a
    # workflow's tool-dispatch budget denies a call, the adapter cancels the
    # attempt and builds its result in the denial branch of the attempt
    # controller (crucible/backends/codex.py, _invoke_with_retries_core)
    # from the result the cancelled attempt left: it takes the two
    # accounting flags of that attempt, which are false, and flags the
    # terminal complete. The result reports every response the provider
