declared_differences:
  - id: D-STRUCT-UNQUALIFIED
    citation: >-
      crucible/backends/features.py:78-81 (the generic gateway profile: the
      adapter sends response_format when requested, but an arbitrary
      compatible gateway has not earned a native-schema conformance claim)
    owner: release owner (design section 15, decisions taken at their defaults)
    date: "2026-11-19"
    alternative: >-
      A route that declares structured_output=unsupported makes no claim about
      where the schema travels, so a scenario with a response schema asserts
      no placement there: neither the schema field of the provider nor schema
      text in the prompt. The final message must still validate against the
      schema and every contract clause applies unchanged. Selected by the
      declared value (the `unsupported` variant of the scenario).
  - id: D-OAI-SCHEMA-FINAL
    citation: >-
      crucible/backends/openai_compat.py:1619-1646 (tool-enabled turns run
      without the response schema; once exploration ends naturally, one
      no-tools completion turns the draft into the schema-constrained answer)
    owner: release owner (design section 15, decisions taken at their defaults)
    date: "2026-11-19"
    alternative: >-
      After a tool loop that ends naturally the adapter sends exactly one
      further request, which advertises no tools and carries the schema in the
      schema field of the provider; no tool-bearing request carries it. The
      answer to that request is the final message (the script answers it with
      another valid text than the draft of the last tool round, and the cell
      requires that one) and must validate against the schema. Its usage is
      counted and the accounting flags stay complete (C6 applies unchanged,
      as does every other clause). On the listed cells this restates where
      the schema field travels and nothing else: what the declared
      structured_output value says about the prompt is still asserted, so a
      route that declares prompt_only owes the schema text once in the system
      prompt (known gap M04 on the hosted cells).
    cells:
      - openai_compat:hosted/S04/primary/raw
      - openai_compat:hosted/S04/primary/guarded
      - openai_compat:hosted/S04/secondary/raw
      - openai_compat:hosted/S04/secondary/guarded
      - openai_compat:local/S04/primary/raw
      - openai_compat:local/S04/primary/guarded
  - id: D-CDX-SERVED
    citation: >-
      crucible/backends/codex.py (_result_with_evidence: the reviewed
      app-server event stream does not expose a provider-served model or
      effort identity, so the trace preserves the requested route without
      presenting it as observed); the notifications of the app-server
      protocol name no served model either (the vendor types of the pinned
      official SDK)
    owner: release owner (design section 15, decisions taken at their defaults)
    date: "2026-11-21"
    alternative: >-
      The wire of the two Codex kinds names no served model, so the provider
      side of a cell names none and clause C7 has nothing to compare the
      trace's served model with. On the listed cells the scenario asserts
      instead that the trace records no served model: an adapter that
      presented the requested model, or any other, as the one that was served
      would deviate. Every clause applies unchanged, C7 with its other checks
      (adapter name, requested model, the model on the wire, the
      feature-profile and tool-authority digests).
    cells:
      - codex:legacy/S01/primary/raw
      - codex:legacy/S01/primary/guarded
      - codex:legacy/S03/primary/raw
      - codex:legacy/S03/primary/guarded
      - codex:legacy/S04/primary/raw
      - codex:legacy/S04/primary/guarded
      - codex:official/S01/primary/raw
      - codex:official/S01/primary/guarded
      - codex:official/S03/primary/raw
      - codex:official/S03/primary/guarded
      - codex:official/S04/primary/raw
      - codex:official/S04/primary/guarded
