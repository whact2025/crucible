# Snapshot of the declared feature profile of every matrix column, by driver
# kind and column role. Static cell P04 recomputes each row with the call
# routing itself makes and requires equality in both directions. A change of a
# declared value therefore fails P04 until this file is edited in the same
# change. If that change is meant to close a known gap, the gap's record in
# ledger.yaml must name it as a `declaration_change`.

schema_version: crucible.backend-matrix.declared-profiles.v1

columns:
  claude:
    primary:
      adapter: claude
      features:
        structured_output: native
        tool_loop: sdk_owned
        session_continuity: workflow_bound
        event_detail: usage
        turn_limit: provider_stop
        response_token_limit: unsupported
        context_byte_limit: unsupported
        usd_limit: post_hoc
        deadline: request_only
        retry_scope: invocation
        cache_control: provider_owned
        cancellation: process_kill
        project_instructions: suppressible
        native_delegation: none
