# The pinned inventory of the backend conformance matrix.
#
# cell_counts: behaviour cells per driver kind. Static cell H03 compares them
#   with what the generator yields, so a cell cannot vanish unnoticed, and
#   the verifier (`python -m tests.backend_matrix.verify`) compares them with
#   the JUnit files of a run. A real kind has no behaviour cell until its
#   driver lands. The comments on the counts name scenario sets (the starter
#   set, pack A); the head of ledger.yaml says what the sets are.
# not_evaluated: (cell, clause) pairs a cell cannot evaluate for a reason of
#   its driver. An unpinned pair fails the cell, and so does a pinned pair
#   whose clause was evaluated. Which clauses apply to a cell is computed from
#   its definition and is not pinned here. Nothing may be pinned on the toy
#   kind except the canary row.
# not_expressible: (scenario or scenario form, kind, script step) triples the
#   wire of a kind cannot carry, each with its reason and, under `checklist`,
#   the capability the missing cell would have checked. This is the only way
#   to mark a cell so. A row has no field for a declared value: no
#   declaration, route extra or admission outcome selects it.
# worker_skip_files: by worker kind, the test files (relative to tests/) that
#   carry a skipif on that worker's interpreter while its H01 cell is a known
#   gap. File names, not counts: static cell H01 reports a marker in a listed
#   file as static:worker_skip and a marker in any other file as
#   static:worker_skip_unpinned, which no entry covers. The list is emptied
#   by the fix that deletes the H01 entry. Empty today: no test file carries
#   such a marker.
# column_wide_not_owed: (cell, code) pairs on which a column-wide known gap of
#   the ledger is not owed for a reason of the cell's definition that the
#   cell's own entry cannot show: its variant expects no result, or its
#   scenario waives the flag that asks for the check. Each row states the
#   reason. The verifier requires the column-wide gap on every other behaviour
#   cell of the kind whose definition has the clause of its code (lens,
#   ToolSet), the seam canary excepted, and refuses it on a pinned cell; a
#   cell whose own entry shows that the check did not run (a raise, a guard
#   rewrite, the cost flagged incomplete) needs no row. Static cell H03
#   rejects a row that is listed twice or names a cell that could not owe the
#   gap. Empty today.
# admission: for each admission cell (S51) of a real column, what the cell
#   must see today: the word the profile catalogs of both products have for
#   the column (availability), and for each capability a workflow can ask
#   routing for (text, read_only, workspace_write) either `admitted` or the
#   type of the exception routing refuses with before it builds the adapter.
#   It pins today's gates, so it changes in the change that opens or closes
#   one. Every admission cell of a real column has exactly one row and every
#   row such a cell, or collection fails. A toy column stands behind no gate
#   and has no row.

schema_version: crucible.backend-matrix.inventory.v1

cell_counts:
  # The starter set and pack A (17 cells) and S51 on each toy column.
  toy: 72
  # Starter set: S00, and S01, S03, S04 in both lenses, on each column.
  claude: 14
  # Starter set: S00, and S01, S03, S04 in both lenses, on the one column.
  "codex:legacy": 7
  # Starter set: S00, and S01, S03, S04 in both lenses, on the one column.
  "codex:official": 7
  # Starter set: S00, and S01, S03, S04 in both lenses, on the one column.
  deepseek: 7
  # Starter set on the two diagnostic columns (7 each); S00, S01 in both
  # lenses and S51 on the blocked column.
  kimi: 18
  # Starter set: S00, and S01, S03, S04 in both lenses, on each column.
  "openai_compat:hosted": 14
  "openai_compat:local": 7

not_evaluated:
  - scenario: S00
    kind: "*"
    role: "*"
    lens: "*"
    clauses: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10]
    reason: >-
      The seam canary proves that the real layers ran and checks C0 only, so
      that it can pass on a column that has contract gaps.

not_expressible: []

column_wide_not_owed: []

worker_skip_files: {}

admission:
  - cell: kimi/S51/blocked/raw
    availability: blocked
    text: admitted
    read_only: admitted
    workspace_write: FeatureAdmissionError
    reason: >-
      The route enforces feature admission and carries no diagnostic writer
      opt-in, so routing refuses the writer role before it builds the adapter:
      a qualification gate and no code defect (it was known as G01 before the
      matrix was built; a gate has no record in the registry of the ledger).
      The text and the read-only role are built. The catalogs call the
      profile blocked; routing itself does not act on that word.
