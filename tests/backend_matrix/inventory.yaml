# The pinned inventory of the backend conformance matrix.
#
# cell_counts: behaviour cells per driver kind. Static cell H03 compares them
#   with what the generator yields, so a cell cannot vanish unnoticed, and
#   the verifier (`python -m tests.backend_matrix.verify`) compares them with
#   the JUnit files of a run. A real kind has no behaviour cell until its
#   driver lands. The comments on the counts name scenario sets (the starter
#   set, pack A, pack B); the head of ledger.yaml says what the sets are.
#   Pack A is ten cells on a column: the turn limit in both lenses, and the
#   suite's turn count, the dispatch-budget denial, the USD overrun, the
#   byte budget, the three forms of refusal and the write as progress in the
#   raw lens; less the forms of refusal that are pinned not expressible
#   below. Pack B runs on the primary column of a kind: one cell there for
#   each lens of each of its scenarios.
# not_evaluated: (cell, clause) pairs a cell cannot evaluate for a reason of
#   its driver. An unpinned pair fails the cell, and so does a pinned pair
#   whose clause was evaluated. Which clauses apply to a cell is computed from
#   its definition and is not pinned here. Nothing may be pinned on the toy
#   kind except the canary row.
# not_expressible: (scenario or scenario form, kind, script step) triples the
#   wire of a kind cannot carry, each with its reason and, under `checklist`,
#   the capability the missing cell would have checked. This is the only way
#   to mark a cell so. A row has no field for a declared value: no
#   declaration, route extra or admission outcome selects it. Eight rows
#   today, all on reference kinds. Five are on forms of refusal: the frames
#   of the Claude tool have no refusal part, and the notifications of the
#   Codex app-server have neither a finish reason nor a refusal part. Three
#   are on the tool call whose argument text is no JSON object: the wire the
#   matrix scripts for the Claude kind and for both Codex kinds is a session
#   of the vendor's tool, on which a tool call travels to the adapter as a
#   decoded object. A kind whose scripted wire is the provider's own reply
#   has no such row, whatever stands between that reply and its adapter:
#   the chat stream of the Kimi kind carries the argument text in a string,
#   and the worker reads it.
# worker_skip_files: by worker kind, the test files (relative to tests/) that
#   carry a skipif on that worker's interpreter while its H01 cell is a known
#   gap. File names, not counts: static cell H01 reports a marker in a listed
#   file as static:worker_skip and a marker in any other file as
#   static:worker_skip_unpinned, which no entry covers. The list is emptied
#   by the fix that deletes the H01 entry. Empty today: no test file carries
#   such a marker.
# column_wide_not_owed: (cell, code) pairs on which a column-wide known gap of
#   the ledger is not owed for a reason of the cell's definition that the
#   cell's own entry cannot show: its variant expects no result, or its
#   scenario waives the flag that asks for the check or expects that flag
#   false. Each row states the reason. The verifier requires the column-wide
#   gap on every other behaviour cell of the kind whose definition has the
#   clause of its code (lens, ToolSet), the seam canary excepted, and
#   refuses it on a pinned cell; a cell whose own entry shows that the check
#   did not run (a raise, a guard rewrite, the cost flagged incomplete)
#   needs no row. Static cell H03 rejects a row that is listed twice or
#   names a cell that could not owe the gap.
# admission: for each admission cell (S51) of a real column, what the cell
#   must see today: the word the profile catalogs of both products have for
#   the column (availability), and for each capability a workflow can ask
#   routing for (text, read_only, workspace_write) one of three outcomes.
#   `admitted`: routing built the adapter and logged no requirement of the
#   role that the profile of the route lacks. `retained`: routing built the
#   adapter and logged such a requirement, which it does on a route that
#   asks for diagnostic admission; the cell reads the warning of the routing
#   module for it. Or the type of the exception routing refuses with before
#   it builds the adapter.
#   Where the driver of a kind adds to the shipped routes something that
#   routing reads when it admits them (`ADMISSION_OVERLAY` in columns.py:
#   the fingerprint of the worker runtime, which a run binds to a DeepSeek
#   route), the cell asks for each capability a second time on the file as
#   shipped, and the row states the outcome of that too (text_as_shipped,
#   read_only_as_shipped, workspace_write_as_shipped).
#   A row pins today's gates, so it changes in the change that opens or
#   closes one. Every admission cell of a real column has exactly one row
#   and every row such a cell, or collection fails. A toy column stands
#   behind no gate and has no row. The cell runs on the primary column of
#   every real kind and on a blocked column.
#   The cell asks routing as the driver of its column asks for every cell:
#   no native shell, no trusted project instructions, an explicit working
#   directory, on the shipped routes. What routing refuses to a caller that
#   asks otherwise, or to a writer route without its opt-in where the
#   shipped route carries it, no cell of the matrix plays. The tests of the
#   routing module hold those refusals: tests/test_backends_config.py for
#   the Kimi routes, tests/test_backends_deepseek.py for the DeepSeek
#   routes.

schema_version: crucible.backend-matrix.inventory.v1

cell_counts:
  # The starter set and pack A (17 cells) and, of pack B, S02, S05, S06, S10b,
  # S14, S17, S25, S26, S27, S41, S44, S45, S50 and S51 on each toy column.
  # There are five toy columns: one for every combination of the declared
  # values that govern a scenario.
  toy: 155
  # Starter set (S00, and S01, S03, S04 in both lenses: 7 cells) and pack A
  # without the refusal part (9 cells), on each of the two columns; S02, S06,
  # S10b, S14, S17, S25, S26, S27, S41, S44, S45, S50 and S51 on the primary
  # column.
  claude: 45
  # Starter set (7 cells), pack A with one form of refusal, the policy
  # error (8 cells), and S02, S06, S10b, S14, S17, S25, S26, S27, S41, S44,
  # S45, S50 and S51, on the one column.
  "codex:legacy": 28
  # Starter set (7 cells), pack A with one form of refusal, the policy
  # error (8 cells), and S02, S06, S10b, S14, S17, S25, S26, S27, S41, S44,
  # S45, S50 and S51, on the one column.
  "codex:official": 28
  # Starter set (7 cells), pack A (10 cells) and S02, S05, S06, S10b, S14,
  # S17, S25, S26, S27, S41, S44, S45, S50 and S51 on the one column.
  deepseek: 31
  # Starter set and pack A on the two diagnostic columns (17 each) and S02,
  # S05, S06, S10b, S14, S17, S25, S26, S27, S41, S44, S45, S50 and S51 on
  # the primary one; S00, S01 in both lenses and S51 on the blocked column.
  kimi: 52
  # Starter set (7 cells) and pack A (10 cells) on each column; S02, S05,
  # S06, S10b, S14, S17, S25, S26, S27, S41, S44, S45, S50 and S51 on the
  # primary column of each kind.
  "openai_compat:hosted": 48
  "openai_compat:local": 31

not_evaluated:
  - scenario: S00
    kind: "*"
    role: "*"
    lens: "*"
    clauses: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10]
    reason: >-
      The seam canary proves that the real layers ran and checks C0 only, so
      that it can pass on a column that has contract gaps.

not_expressible:
  - scenario: S23b
    kind: "claude"
    step: Refuse(refusal_part)
    reason: >-
      The frames of the command-line tool relay the message of the provider,
      whose content blocks have no refusal part (the block types of
      anthropic.types.Message in the pinned SDK): a refusal of this provider
      is the stop reason of the message, which is the content-filter form.
    checklist: >-
      a reply that declines in a refusal part of its message is typed as
      rejected content and is not retried
  - scenario: S23a
    kind: "codex:legacy"
    step: Refuse(content_filter)
    reason: >-
      The notifications of the app-server carry no finish reason of a model
      response (the generated types of the vendor's protocol in the pinned
      official SDK): a reply that a content filter stopped cannot be told
      from any other on this wire. A refusal reaches the client as a failed
      turn whose error names a policy, which is the HTTP-policy form.
    checklist: >-
      a reply that a content filter stopped is typed as rejected content and
      is not retried
  - scenario: S23b
    kind: "codex:legacy"
    step: Refuse(refusal_part)
    reason: >-
      The notifications of the app-server carry an agent message as text
      and have no refusal part (the generated types of the vendor's protocol
      in the pinned official SDK). A refusal reaches the client as a failed
      turn whose error names a policy, which is the HTTP-policy form.
    checklist: >-
      a reply that declines in a refusal part of its message is typed as
      rejected content and is not retried
  - scenario: S23a
    kind: "codex:official"
    step: Refuse(content_filter)
    reason: >-
      The notifications of the app-server carry no finish reason of a model
      response (the generated types of the vendor's protocol in the pinned
      official SDK): a reply that a content filter stopped cannot be told
      from any other on this wire. A refusal reaches the client as a failed
      turn whose error names a policy, which is the HTTP-policy form.
    checklist: >-
      a reply that a content filter stopped is typed as rejected content and
      is not retried
  - scenario: S23b
    kind: "codex:official"
    step: Refuse(refusal_part)
    reason: >-
      The notifications of the app-server carry an agent message as text
      and have no refusal part (the generated types of the vendor's protocol
      in the pinned official SDK). A refusal reaches the client as a failed
      turn whose error names a policy, which is the HTTP-policy form.
    checklist: >-
      a reply that declines in a refusal part of its message is typed as
      rejected content and is not retried
  # A tool call whose argument text is no JSON object, on the three kinds
  # whose scripted wire is a session of the vendor's tool: there a tool call
  # travels to the adapter as a decoded object.
  - scenario: S05
    kind: "claude"
    step: Call(malformed)
    reason: >-
      The tool calls of the command-line tool reach the adapter through the
      control channel of the SDK, as a request of the tool server whose
      arguments are a decoded object (the tools/call message the SDK hands
      to its in-process server): argument text that is no JSON object
      cannot travel there.
    checklist: >-
      a tool call whose arguments are no JSON object is not dispatched,
      least of all with an empty object, and the call does not raise
  - scenario: S05
    kind: "codex:legacy"
    step: Call(malformed)
    reason: >-
      The tool calls of the app-server reach the adapter through its tool
      bridge, as a tools/call request whose arguments are a decoded object:
      argument text that is no JSON object cannot travel there.
    checklist: >-
      a tool call whose arguments are no JSON object is not dispatched,
      least of all with an empty object, and the call does not raise
  - scenario: S05
    kind: "codex:official"
    step: Call(malformed)
    reason: >-
      The tool calls of the app-server reach the adapter through its tool
      bridge, as a tools/call request whose arguments are a decoded object:
      argument text that is no JSON object cannot travel there.
    checklist: >-
      a tool call whose arguments are no JSON object is not dispatched,
      least of all with an empty object, and the call does not raise

column_wide_not_owed:
  - cell: kimi/S23c/primary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The scenario is a request the service rejects before it bills anything,
      so it waives the accounting flags: the check that reports this code is
      not asked of its result.
  - cell: kimi/S23c/primary/raw
    code: "flag:cost_complete=False"
    reason: >-
      The scenario is a request the service rejects before it bills anything,
      so it waives the accounting flags: the check that reports this code is
      not asked of its result.
  - cell: kimi/S23c/secondary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The scenario is a request the service rejects before it bills anything,
      so it waives the accounting flags: the check that reports this code is
      not asked of its result.
  - cell: kimi/S23c/secondary/raw
    code: "flag:cost_complete=False"
    reason: >-
      The scenario is a request the service rejects before it bills anything,
      so it waives the accounting flags: the check that reports this code is
      not asked of its result.
  - cell: codex:official/S23c/primary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The scenario is a request the service rejects before it bills anything,
      so it waives the accounting flags: the check that reports this code is
      not asked of its result.
  - cell: codex:official/S23c/primary/raw
    code: "pricing:unreconciled"
    reason: >-
      The scenario is a request the service rejects before it bills anything,
      so it waives the cost flag, and the adapter flags the cost of the error
      result incomplete: pricing evidence is asked only of a result that
      flags its cost complete.
  # The two broken terminals (S26, S27) on the kinds that carry a
  # column-wide accounting code.
  - cell: kimi/S26/primary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The scenario is a reply that is no terminal of its wire. It owes
      neither accounting flag: where the provider billed nothing for the
      reply, as on this wire, it expects both false. The check that reports
      this code is not asked of its result.
  - cell: kimi/S26/primary/raw
    code: "flag:cost_complete=False"
    reason: >-
      The scenario is a reply that is no terminal of its wire. It owes
      neither accounting flag: where the provider billed nothing for the
      reply, as on this wire, it expects both false. The check that reports
      this code is not asked of its result.
  - cell: kimi/S27/primary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The scenario is a reply that is cut inside the turn, so it expects
      both accounting flags false: the check that reports this code is not
      asked of its result.
  - cell: kimi/S27/primary/raw
    code: "flag:cost_complete=False"
    reason: >-
      The scenario is a reply that is cut inside the turn, so it expects
      both accounting flags false: the check that reports this code is not
      asked of its result.
  - cell: codex:official/S26/primary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The scenario is a reply that is no terminal of its wire. It owes
      neither accounting flag: where the frames that travelled stated the
      usage, as on this wire, it asks neither. The check that reports this
      code is not asked of its result.
  - cell: codex:official/S26/primary/raw
    code: "pricing:unreconciled"
    reason: >-
      The scenario is a reply that is no terminal of its wire and does
      not ask the cost flag, and the adapter flags the cost of the error
      result incomplete: pricing evidence is asked only of a result that
      flags its cost complete.
  - cell: codex:official/S27/primary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The scenario is a reply that is cut inside the turn, so it expects
      both accounting flags false: the check that reports this code is not
      asked of its result.
  - cell: codex:official/S27/primary/raw
    code: "pricing:unreconciled"
    reason: >-
      The scenario is a reply that is cut inside the turn, so it expects
      the cost flag false: pricing evidence is asked only of a result that
      may flag its cost complete.
  # The conversation request (S50) on the kinds that carry a column-wide
  # code. Where the route declares no continuity for a workflow the variant
  # expects a refusal and no result; where it declares it, the scenario
  # asks none of the three flags a scenario may waive.
  - cell: kimi/S50/primary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The route declares no conversation continuity for a workflow, so the
      variant of the scenario expects a refusal before transport and no
      result: no clause about a result is part of the cell.
  - cell: kimi/S50/primary/raw
    code: "flag:cost_complete=False"
    reason: >-
      The route declares no conversation continuity for a workflow, so the
      variant of the scenario expects a refusal before transport and no
      result: no clause about a result is part of the cell.
  - cell: codex:official/S50/primary/raw
    code: "flag:token_usage_complete=False"
    reason: >-
      The scenario is a request to continue a conversation that is refused
      before a model turn is asked, so it waives the accounting flags: the
      check that reports this code is not asked of its result.
  - cell: codex:official/S50/primary/raw
    code: "pricing:unreconciled"
    reason: >-
      The scenario is a request to continue a conversation that is refused
      before a model turn is asked, so it waives the cost flag, and the
      adapter flags the cost of the error result incomplete: pricing
      evidence is asked only of a result that flags its cost complete.

worker_skip_files: {}

admission:
  - cell: claude/S51/primary/raw
    availability: runtime_required
    text: admitted
    read_only: admitted
    workspace_write: admitted
    reason: >-
      Every route of the file enforces feature admission, and the profile
      routing computes for the route meets what each of the three roles
      asks: routing builds the adapter for every capability. The catalogs
      call the profile runtime_required; routing itself does not act on
      that word.
  - cell: codex:legacy/S51/primary/raw
    availability: runtime_required
    text: admitted
    read_only: admitted
    workspace_write: admitted
    reason: >-
      Every route of the file enforces feature admission, and the profile
      routing computes for the route meets what each of the three roles
      asks: routing builds the adapter for every capability. The catalogs
      call the profile runtime_required; routing itself does not act on
      that word.
  - cell: codex:official/S51/primary/raw
    availability: diagnostic
    text: admitted
    read_only: admitted
    workspace_write: admitted
    reason: >-
      Every route of the file asks for diagnostic admission, and the profile
      routing computes for the route meets what each of the three roles
      asks: routing builds the adapter for every capability and logs no
      requirement that the profile lacks, so none of the three is retained.
      The catalogs call the profile diagnostic; routing itself does not act
      on that word.
  - cell: deepseek/S51/primary/raw
    availability: diagnostic
    text: admitted
    read_only: admitted
    workspace_write: admitted
    text_as_shipped: FeatureAdmissionError
    read_only_as_shipped: FeatureAdmissionError
    workspace_write_as_shipped: FeatureAdmissionError
    reason: >-
      The shipped file asks for diagnostic admission on every route, carries
      the diagnostic writer opt-in on the writer role and names no
      fingerprint of the worker runtime: it leaves that to the run. As
      shipped, routing refuses every capability for the missing fingerprint
      before it builds anything. With the fingerprint that the cell
      captures from the installed worker bound to the routes, as every
      other cell of the column binds it, routing builds the adapter for
      every capability and logs no requirement that the profile lacks. So
      no route of this kind is built before a run has bound the worker: a
      qualification gate and no code defect (it was known as G19 before the
      matrix was built; a gate has no record in the registry of the
      ledger). The catalogs call the profile diagnostic; routing itself
      does not act on that word.
  - cell: kimi/S51/blocked/raw
    availability: blocked
    text: admitted
    read_only: admitted
    workspace_write: FeatureAdmissionError
    reason: >-
      The route enforces feature admission and carries no diagnostic writer
      opt-in, so routing refuses the writer role before it builds the adapter:
      a qualification gate and no code defect (it was known as G01 before the
      matrix was built; a gate has no record in the registry of the ledger).
      The text and the read-only role are built. The catalogs call the
      profile blocked; routing itself does not act on that word.
  - cell: kimi/S51/primary/raw
    availability: diagnostic
    text: admitted
    read_only: admitted
    workspace_write: admitted
    reason: >-
      The route asks for diagnostic admission and carries the diagnostic
      writer opt-in, so routing builds the writer role too, on the confined
      boundary the cell asks for (no native shell, no project instructions,
      an explicit working directory), and logs no requirement that the
      profile lacks: the other side of the gate that the blocked column of
      the kind pins. The catalogs call the profile diagnostic; routing
      itself does not act on that word.
  - cell: openai_compat:hosted/S51/primary/raw
    availability: diagnostic
    text: retained
    read_only: retained
    workspace_write: admitted
    reason: >-
      Every route of the file asks for diagnostic admission, under which
      routing refuses no role for what the profile of the route lacks: it
      builds the adapter and logs the requirement. The profile declares no
      structured output, which the roles of the text and of the read-only
      capability ask for, so routing retains those two; the writer role
      asks for nothing that the profile lacks. No route of this kind
      enforces admission: a qualification gate and no code defect (it was
      known as G40 before the matrix was built; a gate has no record in the
      registry of the ledger). The catalogs call the profile diagnostic;
      routing itself does not act on that word.
  - cell: openai_compat:local/S51/primary/raw
    availability: diagnostic
    text: retained
    read_only: retained
    workspace_write: admitted
    reason: >-
      Every route of the file asks for diagnostic admission, under which
      routing refuses no role for what the profile of the route lacks: it
      builds the adapter and logs the requirement. The profile declares no
      structured output, which the roles of the text and of the read-only
      capability ask for, so routing retains those two; the writer role
      asks for nothing that the profile lacks. No route of this kind
      enforces admission: a qualification gate and no code defect (it was
      known as G40 before the matrix was built; a gate has no record in the
      registry of the ledger). The catalogs call the profile diagnostic;
      routing itself does not act on that word.
