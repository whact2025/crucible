# The answer of a model response that calls no tool, as the app-server
# reports it: one completed agent message. Nothing was observed of the real
# tool: where the matrix is built no vendor command-line tool is started,
# signed in or contacted.

schema_version: crucible.backend-matrix.envelope.v1
dialect: codex_app_server
provider: app_server
behaviour: agent_message

provenance:
  grade: constructed
  sdk_type: >-
    openai_codex.generated.v2_all.ItemCompletedNotification with an
    AgentMessageThreadItem (method item/completed in
    openai_codex.generated.notification_registry); read by
    codex_app_server_sdk.client._extract_completed_agent_message
  sdk_version: openai-codex 0.144.4, codex-app-server-sdk 0.3.2
  reason: >-
    The notification holds exactly the fields the generated type of the
    vendor requires (threadId, turnId, completedAtMs, item) and the item
    exactly the required fields of AgentMessageThreadItem (type, id, text),
    without its optional phase and memory citation. Whether the real tool
    marks the last message of a turn with a phase is not known. With a
    response schema the answer is this text: the item type of the vendor has
    no other place for it.

status: 200

body:
  method: item/completed
  params:
    threadId: {slot: thread_id}
    turnId: {slot: turn_id}
    completedAtMs: {slot: created}
    item:
      type: agentMessage
      id: {slot: item_id}
      text: {slot: text}
