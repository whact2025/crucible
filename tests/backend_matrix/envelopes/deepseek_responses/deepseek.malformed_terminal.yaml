# A streamed response that ends without its terminal, in the dialect of the
# DeepSeek Responses route: every event of a plain text answer arrives but
# the terminal, and then the body ends in order.

schema_version: crucible.backend-matrix.envelope.v1
dialect: deepseek_responses
provider: deepseek
behaviour: malformed_terminal

provenance:
  grade: constructed
  reason: >-
    The events are those of the completion envelope of this dialect without
    its last one, the terminal response.completed. Their kinds are the ones
    the vendor's guide to its Responses route lists, and the guide states
    that the usage is null until the terminal event and that the stream has
    no closing message; the remaining keys are those of the completion
    envelope. What is constructed is that the stream ends here: no source
    read for the route states that it ends a stream in order before a
    terminal event, and none was observed to. No event of this envelope
    states a usage, so the scripted provider bills none for the reply. So
    this envelope shows what a client makes of a stream that ends before
    its terminal, not that the route sends one.

status: 200
body:
  - type: response.created
    sequence_number: 0
    response:
      id: {slot: response_id}
      object: response
      created_at: {slot: created}
      status: in_progress
      model: {slot: served_model}
      output: []
      parallel_tool_calls: true
      tool_choice: auto
      tools: []
      usage: null
  - type: response.in_progress
    sequence_number: 1
    response:
      id: {slot: response_id}
      object: response
      created_at: {slot: created}
      status: in_progress
      model: {slot: served_model}
      output: []
      parallel_tool_calls: true
      tool_choice: auto
      tools: []
      usage: null
  - type: response.output_item.added
    sequence_number: 2
    output_index: 0
    item:
      id: {slot: item_id}
      type: message
      role: assistant
      status: in_progress
      content: []
  - type: response.content_part.added
    sequence_number: 3
    item_id: {slot: item_id}
    output_index: 0
    content_index: 0
    part:
      type: output_text
      text: ""
      annotations: []
  - type: response.output_text.delta
    sequence_number: 4
    item_id: {slot: item_id}
    output_index: 0
    content_index: 0
    delta: {slot: text}
    logprobs: []
  - type: response.output_text.done
    sequence_number: 5
    item_id: {slot: item_id}
    output_index: 0
    content_index: 0
    text: {slot: text}
    logprobs: []
  - type: response.content_part.done
    sequence_number: 6
    item_id: {slot: item_id}
    output_index: 0
    content_index: 0
    part:
      type: output_text
      text: {slot: text}
      annotations: []
  - type: response.output_item.done
    sequence_number: 7
    output_index: 0
    item:
      id: {slot: item_id}
      type: message
      role: assistant
      status: completed
      content:
        - type: output_text
          text: {slot: text}
          annotations: []
