# A chat completion that ends cleanly after reasoning and shows no text: the
# visible content is empty, and the output tokens the reply bills are all
# reasoning tokens.

schema_version: crucible.backend-matrix.envelope.v1
dialect: openai_chat
provider: gateway
behaviour: reasoning_only

provenance:
  grade: constructed
  sdk_type: >-
    openai.types.chat.ChatCompletion whose message has an empty content and
    whose usage carries openai.types.CompletionUsage with
    completion_tokens_details.reasoning_tokens; reasoning_content is no field
    of the message type and travels as an extra field, which the type admits
  sdk_version: openai 2.44.0
  notes: >-
    Observed live on 2026-11-18, for one plain request per model id against
    the production hub: a reply of a reasoning model carries
    message.reasoning_content, and its usage, in the OpenAI shape, carries
    reasoning_tokens. Every one of those replies also held visible text. That
    a reply ends cleanly with reasoning and with no visible text at all was
    neither observed nor found in a source: the adapter's own comments say
    that a model of this gateway can spend its whole output on the hidden
    reasoning, which is a statement of the product and no evidence of the
    wire. So the behaviour class is constructed. Choices of this envelope:
    the content is the empty string and not null; the finish reason is
    "stop"; all output tokens are reasoning tokens. No body was stored.

status: 200
body:
  id: {slot: response_id}
  object: chat.completion
  created: {slot: created}
  model: {slot: served_model}
  choices:
    - index: 0
      message:
        role: assistant
        content: ""
        reasoning_content: {slot: reasoning_text}
      finish_reason: stop
  usage:
    prompt_tokens: {slot: input_tokens}
    completion_tokens: {slot: output_tokens}
    total_tokens: {slot: total_tokens}
    completion_tokens_details:
      reasoning_tokens: {slot: reasoning_tokens}
