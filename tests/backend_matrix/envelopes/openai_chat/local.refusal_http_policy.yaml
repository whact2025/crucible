# A request the server rejects for its usage policy before any completion:
# an HTTP 400 with an error object and no usage, as a local
# OpenAI-compatible model server would send it.

schema_version: crucible.backend-matrix.envelope.v1
dialect: openai_chat
provider: local
behaviour: refusal_http_policy

provenance:
  grade: constructed
  sdk_type: >-
    an HTTP 400 whose JSON body holds an error object of the fields of
    openai.types.shared.ErrorObject (code, message, param, type), which the
    SDK raises as openai.BadRequestError with that object as its body
  sdk_version: openai 2.44.0
  notes: >-
    No local model server was run or observed, and no source in reach
    states the status or the error code such a server answers a policy
    rejection with. The status is the one the SDK maps to its bad-request
    error; the four fields are those of the SDK's error object; the code and
    the type are the vendor-neutral spellings of the API the server is
    compatible with, and the message is a fixed sentence of this envelope.
    So this envelope proves that the SDK raises a typed status error for
    such a reply, not that a given server sends it.

status: 400
body:
  error:
    message: The request was rejected because it violates the usage policy.
    type: invalid_request_error
    param: null
    code: content_policy_violation
