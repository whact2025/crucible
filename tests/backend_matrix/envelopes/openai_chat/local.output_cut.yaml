# A chat completion that the server ended at the cap on the tokens of the
# response: the reply is complete, carries the text that was produced before
# the cap and names the cap as its finish reason, as a local
# OpenAI-compatible model server would send it.

schema_version: crucible.backend-matrix.envelope.v1
dialect: openai_chat
provider: local
behaviour: output_cut

provenance:
  grade: constructed
  sdk_type: >-
    openai.types.chat.ChatCompletion whose one choice has the finish_reason
    "length", a value of the closed vocabulary of
    openai.types.chat.chat_completion.Choice.finish_reason, and a message
    whose content is the text produced so far
  sdk_version: openai 2.44.0
  notes: >-
    No local model server was run or observed, and the serving recipes of
    the model family (primary sources, read 2026-11-18) document launch
    flags and parsers, not a reply that ran into its cap. The finish reason
    is the one the SDK types for it; that the message carries the text
    produced before the cap, and that the usage block is the one of a plain
    completion, are choices of this envelope. So it proves that such a reply
    parses through the SDK, not that a given server sends it.

status: 200
body:
  id: {slot: response_id}
  object: chat.completion
  created: {slot: created}
  model: {slot: served_model}
  choices:
    - index: 0
      message:
        role: assistant
        content: {slot: text}
      finish_reason: length
  usage:
    prompt_tokens: {slot: input_tokens}
    completion_tokens: {slot: output_tokens}
    total_tokens: {slot: total_tokens}
