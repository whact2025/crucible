# A chat completion that ends cleanly with visible text, as a local
# OpenAI-compatible model server answers a plain request.

schema_version: crucible.backend-matrix.envelope.v1
dialect: openai_chat
provider: local
behaviour: completion

provenance:
  grade: constructed
  sdk_type: openai.types.chat.ChatCompletion
  sdk_version: openai 2.44.0
  notes: >-
    No local model server was run or observed. The servers the route is meant
    for implement the OpenAI chat-completions API (port note
    open-weight-research.json, topic "glm", packages and api_changes[3] and
    [6]: the serving recipes, primary sources, read 2026-11-18), and those
    sources document launch flags and parsers, not a reply body. So this
    envelope holds the required fields of the SDK type and proves that the
    reply parses, not that a given server sends it.

status: 200
body:
  id: {slot: response_id}
  object: chat.completion
  created: {slot: created}
  model: {slot: served_model}
  choices:
    - index: 0
      message:
        role: assistant
        content: {slot: text}
      finish_reason: stop
  usage:
    prompt_tokens: {slot: input_tokens}
    completion_tokens: {slot: output_tokens}
    total_tokens: {slot: total_tokens}
