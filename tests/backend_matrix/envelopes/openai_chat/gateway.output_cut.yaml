# A chat completion that the provider ended at the cap on the tokens of the
# response: the reply is complete and billed, carries the text that was
# produced before the cap and names the cap as its finish reason, in the
# hosted gateway's dialect.

schema_version: crucible.backend-matrix.envelope.v1
dialect: openai_chat
provider: gateway
behaviour: output_cut

provenance:
  grade: constructed
  sdk_type: >-
    openai.types.chat.ChatCompletion whose one choice has the finish_reason
    "length", a value of the closed vocabulary of
    openai.types.chat.chat_completion.Choice.finish_reason, and a message
    whose content is the text produced so far
  sdk_version: openai 2.44.0
  notes: >-
    Nothing was observed and nothing is documented in reach: no reply of the
    gateway was driven into its cap, and no source read for it states how it
    reports one. The finish reason is the one the SDK types for it ("length"
    if the maximum number of tokens specified in the request was reached, in
    the SDK's description of the field). That the message carries the text
    produced before the cap, and that the usage block is the one of a plain
    completion, are choices of this envelope. So it proves that such a reply
    parses through the SDK, not that the gateway sends it.

status: 200
body:
  id: {slot: response_id}
  object: chat.completion
  created: {slot: created}
  model: {slot: served_model}
  choices:
    - index: 0
      message:
        role: assistant
        content: {slot: text}
      finish_reason: length
  usage:
    prompt_tokens: {slot: input_tokens}
    completion_tokens: {slot: output_tokens}
    total_tokens: {slot: total_tokens}
