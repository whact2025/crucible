# A chat completion in which the model declines: the reply is billed, has no
# content and carries the refusal in the refusal field of its message, as a
# local OpenAI-compatible model server would send it.

schema_version: crucible.backend-matrix.envelope.v1
dialect: openai_chat
provider: local
behaviour: refusal_part

provenance:
  grade: constructed
  sdk_type: >-
    openai.types.chat.ChatCompletion whose message is an
    openai.types.chat.ChatCompletionMessage with the refusal field set and
    no content
  sdk_version: openai 2.44.0
  notes: >-
    No local model server was run or observed, and no source in reach
    states that such a server fills the refusal field. The field is the one
    the SDK types for the refusal message of the model; the finish reason
    "stop" and the usage block are those of a plain completion, and the
    refusal text is a fixed sentence of this envelope. So this envelope
    proves that such a reply parses through the SDK, not that a given server
    sends it.

status: 200
body:
  id: {slot: response_id}
  object: chat.completion
  created: {slot: created}
  model: {slot: served_model}
  choices:
    - index: 0
      message:
        role: assistant
        content: null
        refusal: The request was declined.
      finish_reason: stop
  usage:
    prompt_tokens: {slot: input_tokens}
    completion_tokens: {slot: output_tokens}
    total_tokens: {slot: total_tokens}
