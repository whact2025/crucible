# A request the service rejects for its usage policy before any completion:
# an HTTP 400 with an error object and no usage, in the hosted gateway's
# dialect.

schema_version: crucible.backend-matrix.envelope.v1
dialect: openai_chat
provider: gateway
behaviour: refusal_http_policy

provenance:
  grade: constructed
  sdk_type: >-
    an HTTP 400 whose JSON body holds an error object of the fields of
    openai.types.shared.ErrorObject (code, message, param, type), which the
    SDK raises as openai.BadRequestError with that object as its body
  sdk_version: openai 2.44.0
  notes: >-
    Nothing was observed and nothing is documented in reach: no policy
    rejection was induced against the gateway, and no source states the
    status or the error code it answers with. The status is the one the SDK
    maps to its bad-request error; the four fields are those of the SDK's
    error object; the code and the type are the vendor-neutral spellings of
    the API the gateway is compatible with, and the message is a fixed
    sentence of this envelope. So this envelope proves that the SDK raises a
    typed status error for such a reply, not that the gateway sends it.

status: 400
body:
  error:
    message: The request was rejected because it violates the usage policy.
    type: invalid_request_error
    param: null
    code: content_policy_violation
