[project]
name = "crucible-codex-worker"
version = "0.1.0"
description = "Isolated official OpenAI Codex SDK transport worker for Crucible"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Exact-bound: the SDK release pins the matching Codex CLI runtime.
    # Update only with the CDX-02 parity, audit, and lock-hash gates.
    "openai-codex==0.144.4",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_codex_worker"]
