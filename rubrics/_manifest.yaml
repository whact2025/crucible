# Executable contracts for every bundled Crucible reviewer.
# Criterion/category pairing, output rules, target closure, and judge outcomes
# are runtime-validated; rubric YAML contains only role-specific instructions.

schema_version: crucible.rubric-manifest.v2
rubrics:
  plan_selection:
    family: planning
    role: judge
    status: active
    artifact_kind: hash_bound_competing_plans
    required_context: []
    allowed_decisions:
    - pass
    - inconclusive
    severity_floor: High
    completeness: full_required
    tools: none
    evidence_sources:
    - artifact
    criterion_results: required
    criterion_categories:
      plan_choice:
      - selected
      - synthesized
      - no_selection
    output:
      proposal: exactly_one
      attack_spec: forbidden
      replacement_default: required
      replacement_rules: []
    target_closure: none
    outcome:
      cardinality: exactly_one
      cases:
      - decision: pass
        category: selected
        finding_id: plan_selection
        severity: Low
        disposition: addressed
      - decision: pass
        category: synthesized
        finding_id: plan_selection
        severity: Low
        disposition: addressed
      - decision: inconclusive
        category: no_selection
        finding_id: plan_selection
        severity: Low
        disposition: addressed
    consumers:
    - workflows/_plan_selection.py
  api_contract_fidelity:
    family: core_review
    role: reviewer
    status: active
    artifact_kind: implementation_diff
    required_context:
    - spec_intent
    allowed_decisions:
    - pass
    - revise
    - reject
    - inconclusive
    severity_floor: High
    completeness: full_required
    tools: none
    evidence_sources:
    - artifact
    - spec_intent
    criterion_categories:
      api_name:
      - api_deviation
      api_shape:
      - api_deviation
      api_signature:
      - api_deviation
      api_type:
      - api_deviation
    output:
      proposal: required_each
      attack_spec: forbidden
      replacement_default: required
      replacement_rules: []
    target_closure: none
    outcome:
      cardinality: any
      cases: []
    consumers:
    - workflows/tier.py
  breach_attack_authority:
    family: breach
    role: reviewer
    status: active
    artifact_kind: hash_bound_attack_authority_bundle
    coverage_completeness: artifact_attested
    artifact_finding_id_closure:
      schema_version: crucible.breach-authority-admission.v1
      collection_path:
      - generated_attacks
      id_field: attack_id
    required_context: []
    allowed_decisions:
    - pass
    - inconclusive
    severity_floor: Low
    completeness: full_required
    tools: none
    evidence_sources:
    - artifact
    criterion_categories:
      attack_authority:
      - compatible
      - additive
      - directive_conflict
      - unsupported
      - inconclusive
    output:
      proposal: forbidden
      attack_spec: forbidden
      replacement_default: forbidden
      replacement_rules: []
    target_closure: none
    outcome:
      cardinality: any
      cases: []
    consumers:
    - workflows/breach.py
  breach_attack_entailment:
    family: breach
    role: reviewer
    status: active
    artifact_kind: hash_bound_attack_entailment_bundle
