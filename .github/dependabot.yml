version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development
