  # Arm C routes kimi-k3.1-pro through backends_kimi_sdk_diagnostic.yaml,
  # whose roles carry extra.diagnostic_cost_upper_bound. Observed on
  # 2026-11-18: Moonshot's streamed final usage omits
  # prompt_tokens_details.cached_tokens when nothing was read from cache and
  # sends it on a cache hit. No acceptance follows from that observation: a
  # reply without the counter is settled only as a cost interval under
  # --diagnostic-cost-policy kimi-k3.1-pro-cache-read-upper-bound-v1, which
  # crucible deepswe accepts only with --planner-count 1 and one fresh task.
  # This plan passes no cost policy and fixes planner_count: 3, so its Arm C
  # cells are refused when the backend is bound, before any provider request.
  C:
    id: kimi-k3.1-pro-diagnostic
    backend: kimi
    runtime_backend: kimi
    transport: kimi_agent_sdk_worker
    model: kimi-k3.1-pro
    effort: max
    feature_admission: diagnostic
    evidence_status: diagnostic
    routing: backends_kimi_sdk_diagnostic.yaml
    routing_sha256: sha256:847a868cffcfcef12aacff8b0a709ef990c61cd2fe8175b271dc1a104c4a6c65
