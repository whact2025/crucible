# Explicit Claude/Mythos 5.1 route for DeepSWE diagnostic convergence runs.
#
# Every DeepSWE paid role is pinned to the authenticated NVIDIA organization
# session. This profile is separate from both the Fable 5.1 convergence route
# and the frozen Opus 5 E12 route. It configures no base URL, API key, model
# fallback, or configured-inference authority.

schema_version: crucible.backend-routing.v1

default:
  backend: claude
  model: claude-mythos-5-1
  effort: high
  feature_admission: enforce
  extra:
    credential_source: claude_session
    expected_org_id: 76f2dd92-7d56-4550-afaf-abd363e3235c
    expected_org_name: NVIDIA Corporation - Power Users

roles:
  architect_planner:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: &session
      credential_source: claude_session
      expected_org_id: 76f2dd92-7d56-4550-afaf-abd363e3235c
      expected_org_name: NVIDIA Corporation - Power Users

  architect_critic:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  architect_judge:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  implementer:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  breach_defender:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  impl_breaker:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  breach_judge:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  diff_scope:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  tier_completeness:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  api_contract_fidelity:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session

  review_conflict_authority:
    backend: claude
    model: claude-mythos-5-1
    effort: high
    feature_admission: enforce
    extra: *session
