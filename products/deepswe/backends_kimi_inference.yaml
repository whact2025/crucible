# DeepSWE diagnostic control — Kimi K2.6 over OpenAI-compatible HTTP.
#
# This profile qualifies the NVIDIA wire route; it is not the dedicated Kimi
# SDK comparison arm. Its served-model pin rejects response identity drift.
# Source ~/.config/crucible/env before use.

