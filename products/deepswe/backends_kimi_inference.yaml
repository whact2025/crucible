# DeepSWE diagnostic control — Kimi K3.1 Pro over OpenAI-compatible HTTP.
#
# This profile qualifies the NVIDIA wire route; it is not the dedicated Kimi
# SDK comparison arm. That qualification has not been repeated for K3.1 Pro.
# On 2026-11-18 the hub listed the id and answered one-line requests for it
# through `OpenAIBackend` under this model name (text, a strict `json_schema`
# response, a tool loop with the constrained finalization, a required write
# turn); an earlier request that day was rate-limited. That is a transport
# observation, not a qualification. Its served-model pin rejects response
# identity drift. Source ~/.config/crucible/env before use.

schema_version: crucible.backend-routing.v1

default:
  backend: openai_compat
  base_url: ${INFER_BASE_URL}
  api_key: ${INFER_AUTH_TOKEN}
  model: nvidia/moonshotai/kimi-k3.1-pro
  effort: high
  feature_admission: diagnostic
  extra:
    expected_served_model: nvidia/moonshotai/kimi-k3.1-pro

