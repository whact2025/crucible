# Run-local-binding DeepSWE diagnostic profile for native DeepSeek Responses.
#
# The adapter is fixed to the DeepSeek Flash request alias
# (``deepseek-flash``), the first-party Responses host, high reasoning, one
# physical attempt, and the project-owned locked worker. The vendor moves that
# alias between snapshots without an id change, so the route attests the
# returned alias and not a snapshot; a reply that names any other model is
# rejected as a served-model mismatch. On 2026-11-18 the streamed Responses
# reply to this request named ``deepseek-flash``. Cost is recorded at the
# published peak rate: it equals the charge at peak and is twice the charge
# off-peak, an upper bound of the amount billed.
# A bound run-local copy is usable for diagnostic workflow routing. Only the
# explicitly opted-in implementer and breach_defender roles admit confined
# diagnostic workspace writes. Prompt-only structured output with deterministic
# Crucible validation is admitted; provider-native constrained output is not.
# DSK-00b/DSK-02 still block promotion and formal comparison. The installed
# worker fingerprint contains host paths, so a real diagnostic must derive a
# run-local copy of this file and add
# ``expected_worker_runtime_fingerprint`` from the provider-free capture API.
# Every role states the wall of one call, ``timeout_seconds: 2700``: the
# 45 minutes the Codex adapter gives a turn. A call that carries no policy
# runs under that wall; a policy on the call can only shorten it.
# One call runs at most 64 provider rounds, and a call that asks for more
# turns is refused before any request: a run on this profile passes
# ``--max-turns 64`` or less (the suite's default is 90).
# This checked-in profile reads no credential and authorizes no provider call.

schema_version: crucible.backend-routing.v1

default:
  backend: deepseek
  model: deepseek-flash
  feature_admission: diagnostic
  extra:
    max_response_tokens: 32000
    timeout_seconds: 2700

roles:
  architect_planner:
    backend: deepseek
    model: deepseek-flash
    feature_admission: diagnostic
    extra:
      max_response_tokens: 32000
      timeout_seconds: 2700

