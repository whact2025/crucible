# Run-local-binding DeepSWE diagnostic profile for native DeepSeek Responses.
#
# The adapter is fixed to DeepSeek V4 Flash, the first-party Responses host,
# high reasoning, one physical attempt, and the project-owned locked worker.
# A bound run-local copy is usable for diagnostic workflow routing. Only the
# explicitly opted-in implementer and breach_defender roles admit confined
# diagnostic workspace writes. Prompt-only structured output with deterministic
# Crucible validation is admitted; provider-native constrained output is not.
# DSK-00b/DSK-02 still block promotion and formal comparison. The installed
# worker fingerprint contains host paths, so a real diagnostic must derive a
# run-local copy of this file and add
# ``expected_worker_runtime_fingerprint`` from the provider-free capture API.
# This checked-in profile reads no credential and authorizes no provider call.

schema_version: crucible.backend-routing.v1

default:
  backend: deepseek
  model: deepseek-v4-flash
  feature_admission: diagnostic
  extra:
    max_response_tokens: 32000
    timeout_seconds: 600

roles:
  architect_planner:
    backend: deepseek
    model: deepseek-v4-flash
    feature_admission: diagnostic
    extra:
      max_response_tokens: 32000
      timeout_seconds: 600

