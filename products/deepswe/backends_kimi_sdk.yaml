    base_url: ${KIMI_BASE_URL}
    api_key: ${MOONSHOT_API_KEY}
    model: kimi-k2.7-code-highspeed
    feature_admission: enforce
    extra:
      worker_source: project_locked
  breach_judge:
    backend: kimi
    base_url: ${KIMI_BASE_URL}
