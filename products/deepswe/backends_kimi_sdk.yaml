# DeepSWE A/B/C Arm C — dedicated Moonshot Kimi Agent SDK backend.
#
# Source ~/.config/crucible/env first. Missing SDK qualification,
# Moonshot authentication, or exact K2.7 Code access fails before task
# execution. This route is separate from the NVIDIA K2.6 diagnostic control.

schema_version: crucible.backend-routing.v1

default:
  backend: kimi
  base_url: ${KIMI_BASE_URL}
  api_key: ${MOONSHOT_API_KEY}
  model: kimi-k2.7-code-highspeed
  feature_admission: enforce
  extra:
    worker_source: project_locked

roles:
  # K2.7 counts private reasoning inside max_tokens. Keep a cautious 16K
  # planner allowance while leaving non-planner routes at the qualified 32K
  # adapter default.
  plan_planner:
    extra:
      max_response_tokens: 16384
  architect_planner:
    backend: kimi
    base_url: ${KIMI_BASE_URL}
    api_key: ${MOONSHOT_API_KEY}
    model: kimi-k2.7-code-highspeed
    feature_admission: enforce
    extra:
      worker_source: project_locked
      max_response_tokens: 16384
  implementer:
    backend: kimi
    base_url: ${KIMI_BASE_URL}
    api_key: ${MOONSHOT_API_KEY}
    model: kimi-k2.7-code-highspeed
    feature_admission: enforce
    extra:
      worker_source: project_locked
      timeout_seconds: 1200
  architect_critic:
    backend: kimi
    base_url: ${KIMI_BASE_URL}
    api_key: ${MOONSHOT_API_KEY}
    model: kimi-k2.7-code-highspeed
