# Explicit Codex/Astra route for DeepSWE backend-convergence runs.
#
# Every DeepSWE paid role uses the same direct ChatGPT-session identity. This
# is separate from the frozen GPT-5.6 Sol E12 profile and deliberately has no
# provider, model, endpoint, credential, or transport fallback.

schema_version: crucible.backend-routing.v1

default:
  backend: codex
  model: gpt-6-astra
  effort: max
  feature_admission: enforce
  extra:
    credential_source: chatgpt_session

