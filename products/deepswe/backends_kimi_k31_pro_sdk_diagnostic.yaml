# DeepSWE K3.1 Pro diagnostic Moonshot Kimi Agent SDK route.
#
# Explicit opt-in for a diagnostic run, separate from frozen E12 Arm C, the
# all-role diagnostic writer profile, and any existing cohort. This grants no
# promotion authority.
# Source ~/.config/crucible/env before loading; bind the exact worker runtime
# and fresh run/route identity before any separately authorized provider call.
# Only implementer and breach_defender opt in to confined diagnostic writes.
#
# Observed on 2026-11-18 for kimi-k3.1-pro: Moonshot's streamed final usage
# omits prompt_tokens_details.cached_tokens when nothing was read from cache,
# with or without a cache write, and sends it on a cache hit. No acceptance
# follows from that observation: strict accounting rejects a reply without
# the counter after it was billed (counter_missing, field R), and a missing
# counter is never read as zero.
#
# Every role therefore carries extra.diagnostic_cost_upper_bound: true, the
# adapter half of the cost upper-bound policy
# kimi-k3.1-pro-cache-read-upper-bound-v1. Routing admits it only with this
# exact model, effort max, feature_admission: diagnostic, the public Moonshot
# endpoint and worker_source: project_locked. A run returns a result only
# when it also passes
#   --backend-limit-mode diagnostic --backend-limit-deadline-seconds <seconds>
#   --diagnostic-cost-policy kimi-k3.1-pro-cache-read-upper-bound-v1
#   --budget-usd <finite positive amount>
# and, for crucible deepswe, --planner-count 1 with exactly one fresh task
# (no --rerun, no --rerun-status). Diagnostic limits without the policy are
# refused when the backend is bound, before any provider request; without a
# limit mode the adapter refuses an invocation that has no finite positive
# budget, and a budgeted reply whose read count is missing is recorded as
# incomplete accounting, which authorizes no further paid work. A result is
# a cost interval: diagnostic, never rankable or promotable.
#
# Every route states the wall of one call, extra.timeout_seconds: 2700, the
# 45 minutes the Codex adapter gives a turn. Under diagnostic limits a call
# runs under the smaller of that wall and --backend-limit-deadline-seconds,
# so a run that means its calls to have the wall passes a deadline of 2700
# or more; a smaller deadline shortens every call to it. Every route also
# states the response bound, extra.max_response_tokens: 32768.

schema_version: crucible.backend-routing.v1

default:
  backend: kimi
  model: kimi-k3.1-pro
  effort: max
  base_url: ${KIMI_BASE_URL}
  api_key: ${MOONSHOT_API_KEY}
  feature_admission: diagnostic
  extra:
    worker_source: project_locked
    max_response_tokens: 32768
    diagnostic_cost_upper_bound: true
    timeout_seconds: 2700

