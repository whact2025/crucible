# DeepSWE routing — NVIDIA Inference Hub through the OpenAI-compatible
# transport.  This is an explicit opt-in profile; omitting --backend-config
# retains Crucible's built-in Codex default.
#
# Every DeepSWE comparison role explicitly pins the same GLM-5.3 route, and
# `expected_served_model` rejects response-identity drift. On 2026-11-18 the
# hub listed this id and answered one-line requests for it through
# `OpenAIBackend` under this model name (text, a strict `json_schema`
# response, a tool loop with the constrained finalization, a required write
# turn). That is a transport observation, not a qualification: the route
# carries the generic OpenAI-compatible feature profile. The model's pricing
# entry is zero-rate, carried over from the GLM-5.2 row (no per-token charge
# has been verified for this id; on 2026-11-18 the hub's model information
# reported a non-zero cost per token for it, so the zero may understate),
# while token/call telemetry is still recorded. Keep the secret outside the
# repository:
#
#   export INFER_AUTH_TOKEN=...
#   crucible deepswe --backend-config \
#     products/deepswe/backends_inference_hub.yaml ...

schema_version: crucible.backend-routing.v1

default:
  backend: openai_compat
  base_url: ${INFER_BASE_URL}
  api_key: ${INFER_AUTH_TOKEN}
  model: nvidia/zai-org/glm-5.3
  feature_admission: diagnostic
  extra:
    expected_served_model: nvidia/zai-org/glm-5.3

roles:
