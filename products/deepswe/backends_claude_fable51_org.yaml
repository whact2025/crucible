# Explicit Claude/Fable 5.1 route for DeepSWE backend-convergence runs.
#
# Every DeepSWE paid role is pinned to the authenticated NVIDIA organization
# session. This is separate from the frozen Opus 5 E12 profile and configures
# no base URL, API key, model fallback, or configured-inference authority.

schema_version: crucible.backend-routing.v1

default:
  backend: claude
  model: claude-fable-5-1
  effort: high
  feature_admission: enforce
  extra:
    credential_source: claude_session
    expected_org_id: 76f2dd92-7d56-4550-afaf-abd363e3235c
    expected_org_name: NVIDIA Corporation - Power Users

